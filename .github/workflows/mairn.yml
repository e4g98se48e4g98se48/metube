name: 🦙 Qwen & DeepSeek Web UI

on:
  workflow_dispatch:
    inputs:
      model:
        description: '📦 Model to run (Qwen & DeepSeek only)'
        required: false
        default: 'qwen2.5:3b'
        type: choice
        options:
          # --- Qwen 2.5 Family ---
          - 'qwen2.5:0.5b'
          - 'qwen2.5:1.5b'
          - 'qwen2.5:3b'
          - 'qwen2.5-coder:3b'
          - 'qwen2.5:7b'
          - 'qwen2.5-coder:7b'
          - 'qwen2.5:14b'
          # --- DeepSeek R1 Family ---
          - 'deepseek-r1:1.5b'
          - 'deepseek-r1:7b'
          - 'deepseek-r1:8b'
          - 'deepseek-r1:14b'
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string

permissions:
  contents: read

concurrency:
  group: llama-web-ui
  cancel-in-progress: true

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL_NAME: ${{ inputs.model }}
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}
    
    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║            🧠  Q W E N   &   D E E P S E E K   U I                ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📦 Model:   ${MODEL_NAME}"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"

      - name: 🧹 Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          pip install uv
          uv pip install --system fastapi uvicorn aiohttp httpx python-multipart jinja2 websockets pydantic

      - name: 🚀 Start Ollama server
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          
          echo "⏳ Waiting for Ollama..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Failed to start Ollama"
          cat /tmp/ollama.log
          exit 1

      - name: 📥 Download model
        run: |
          echo "⏳ Pulling ${MODEL_NAME}..."
          ollama pull "$MODEL_NAME" || (df -h / && exit 1)

      - name: 🔧 Write the web server
        run: |
          cat > ollama_server.py << 'PYEOF'
          #!/usr/bin/env python3
          import json
          import os
          import logging
          from typing import Optional, List
          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("llama-ui")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          MODEL_NAME = os.getenv("MODEL_NAME", "qwen2.5:3b")
          PORT = int(os.getenv("PORT", "7860"))

          # 🔥 Anti-Hallucination & Language Strict Prompt 🔥
          SYSTEM_PROMPT = """You are a highly intelligent, precise, and logical AI assistant. 
          CRITICAL RULES YOU MUST FOLLOW:
          1. ALWAYS communicate in the EXACT SAME LANGUAGE the user uses (If the user speaks Persian, you MUST reply in natural, flawless Persian).
          2. NEVER output unexpected Cyrillic (e.g., ИИ), Russian, or Chinese characters.
          3. NEVER hallucinate. If you do not know the answer, state it clearly.
          4. Format your code blocks perfectly and use markdown effectively.
          5. Keep your tone professional, helpful, and direct."""

          app = FastAPI(title="Local LLM UI")

          class ChatMessage(BaseModel):
              role: str
              content: str

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              temperature: Optional[float] = 0.6
              max_tokens: Optional[int] = 2048

          http_limits = httpx.Limits(max_keepalive_connections=5, max_connections=10)

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=5, limits=http_limits) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok", "model": MODEL_NAME}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE.replace("__MODEL_NAME__", MODEL_NAME).replace("__CONTEXT__", str(CONTEXT_SIZE))

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              ollama_messages = [{"role": "system", "content": SYSTEM_PROMPT}]
              ollama_messages.extend([{"role": m.role, "content": m.content} for m in request.messages])

              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=300, limits=http_limits) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": MODEL_NAME,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  yield f"data: {json.dumps({'error': 'Backend connection error'})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return

                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line: continue
                                  try:
                                      obj = json.loads(line)
                                      if err := obj.get("error"):
                                          yield f"data: {json.dumps({'error': err})}\n\n"
                                          continue
                                      content = obj.get("message", {}).get("content")
                                      if content is not None:
                                          yield f"data: {json.dumps({'content': content})}\n\n"
                                  except json.JSONDecodeError: continue
                  except Exception as exc:
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"

              return StreamingResponse(generate(), media_type="text/event-stream")

          HTML_TEMPLATE = r'''
          <!DOCTYPE html>
          <html lang="en" class="dark">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>LLM Interface · __MODEL_NAME__</title>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          
          <style>
            :root {
              --bg: #09090b; 
              --sidebar: rgba(24, 24, 27, 0.65); 
              --border: rgba(255, 255, 255, 0.08);
              --text: #f8fafc; 
              --text-secondary: #94a3b8; 
              --accent-gradient: linear-gradient(135deg, #10b981, #06b6d4);
              --user-bg: rgba(16, 185, 129, 0.06); 
              --assistant-bg: transparent; 
              --input-bg: rgba(24, 24, 27, 0.7);
              --code-bg: #1e1e22; 
              --danger: #ef4444; 
              --ok: #10b981;
            }
            
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
              font-family: 'Vazirmatn', 'Inter', sans-serif; direction: auto;
            }
            h1, h2, h3, h4, .title { font-family: 'Plus Jakarta Sans', 'Vazirmatn', sans-serif; }
            code, pre { font-family: 'JetBrains Mono', monospace; direction: ltr; text-align: left; }
            
            /* 🔥 DeepSeek Thinking Box (Glassmorphic) 🔥 */
            think {
              display: block; margin: 16px 0; padding: 14px 18px;
              background: rgba(6, 182, 212, 0.03);
              border: 1px solid rgba(6, 182, 212, 0.15); border-left: 4px solid #06b6d4;
              border-radius: 8px; color: #94a3b8; font-size: 0.9em; line-height: 1.6;
              white-space: pre-wrap; font-style: italic; direction: auto;
            }
            think::before { 
              content: '🧠 Thinking Process...'; display: flex; align-items: center; 
              font-weight: 600; margin-bottom: 8px; color: #06b6d4; font-style: normal; font-family: 'Plus Jakarta Sans', sans-serif;
            }

            .sidebar {
              width: 280px; background: var(--sidebar); border-right: 1px solid var(--border);
              backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
              display: flex; flex-direction: column; padding: 20px; flex-shrink: 0;
            }
            .new-chat-btn {
              display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px;
              background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
              font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 24px;
              transition: all 0.2s ease;
            }
            .new-chat-btn:hover { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
            
            .settings-group { display: flex; flex-direction: column; gap: 14px; font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
            .settings-group label { display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
            .settings-group input[type="range"] { width: 100%; accent-color: #10b981; margin-top: 6px; }
            
            .sidebar-footer {
              margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px;
              font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 10px;
            }
            .model-tag {
              background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2);
              color: #10b981; padding: 6px 10px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; text-align: center; font-size: 11px;
            }
            .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
            .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
            .status-dot.bad { background: var(--danger); }
            
            .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at 50% 0%, rgba(16,185,129,0.03) 0%, transparent 70%); }
            .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 0 0 160px 0; scroll-behavior: smooth; }
            
            .message-row { width: 100%; display: flex; justify-content: center; padding: 32px 24px; animation: fadeIn .3s ease; border-bottom: 1px solid rgba(255,255,255,0.02); }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
            
            .message-row.user { background: var(--user-bg); }
            .message-inner { max-width: 840px; width: 100%; display: flex; gap: 20px; line-height: 1.8; font-size: 15px; }
            
            .avatar {
              width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
              font-size: 14px; font-weight: 600; flex-shrink: 0; color: #fff; font-family: 'Inter', sans-serif;
            }
            .avatar.user { background: #1e293b; border: 1px solid var(--border); }
            .avatar.assistant { background: var(--accent-gradient); box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
            
            .message-body { flex: 1; min-width: 0; }
            .message-body p { margin-bottom: 16px; }
            .message-body p:last-child { margin-bottom: 0; }
            .message-body h1, .message-body h2, .message-body h3 { margin: 24px 0 12px; color: #fff; }
            
            .message-body pre {
              background: var(--code-bg); padding: 36px 16px 16px; border-radius: 12px;
              overflow-x: auto; margin: 16px 0; border: 1px solid var(--border); position: relative;
            }
            .message-body code { background: rgba(255,255,255,0.08); padding: 3px 6px; border-radius: 6px; font-size: 13.5px; }
            .message-body pre code { background: transparent; padding: 0; }
            
            .copy-btn {
              position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
              color: #cbd5e1; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s;
              font-family: 'Inter', sans-serif;
            }
            .copy-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
            
            .input-area-wrapper {
              position: absolute; bottom: 0; left: 0; width: 100%;
              background: linear-gradient(180deg, transparent 0%, var(--bg) 30%);
              padding: 24px 24px 32px; display: flex; justify-content: center; pointer-events: none;
            }
            .input-box {
              max-width: 840px; width: 100%; background: var(--input-bg); border: 1px solid var(--border);
              backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); pointer-events: auto;
              border-radius: 24px; display: flex; align-items: flex-end; padding: 14px 16px 14px 24px; gap: 12px;
              box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); transition: border-color 0.2s; direction: rtl; /* helps with mixed input */
            }
            .input-box:focus-within { border-color: rgba(16,185,129,0.4); }
            .input-box textarea {
              flex: 1; background: transparent; border: none; color: var(--text); font-family: inherit;
              font-size: 15px; resize: none; outline: none; max-height: 200px; min-height: 24px; line-height: 24px; direction: auto;
            }
            .send-btn, .stop-btn {
              border: none; border-radius: 14px; width: 40px; height: 40px; display: flex; align-items: center;
              justify-content: center; color: #fff; cursor: pointer; flex-shrink: 0; transition: all 0.2s;
            }
            .send-btn { background: var(--accent-gradient); box-shadow: 0 2px 10px rgba(16,185,129,0.2); font-weight: bold; }
            .stop-btn { background: var(--danger); display: none; font-size: 18px; }
            .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(16,185,129,0.3); }
            .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
            
            .loading-dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
            @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
          </style>
          </head>
          <body>
            <div class="sidebar">
              <button class="new-chat-btn" onclick="clearChat()">＋ Start New Session</button>
              
              <div class="settings-group">
                <div>
                  <label>Temperature: <span id="tempVal">0.6</span></label>
                  <input type="range" id="temperature" min="0" max="1" step="0.1" value="0.6">
                </div>
              </div>
              
              <div class="sidebar-footer">
                <div class="model-tag">📦 __MODEL_NAME__</div>
                <div class="model-tag">⚙️ Ctx: __CONTEXT__</div>
                <span id="statusIndicator"><span class="status-dot ok"></span>Connecting...</span>
              </div>
            </div>
            
            <div class="main-content">
              <div class="chat-container" id="chatContainer">
                <div class="message-row assistant">
                  <div class="message-inner">
                    <div class="avatar assistant">✦</div>
                    <div class="message-body" id="welcomeMsg"></div>
                  </div>
                </div>
              </div>
              <div class="input-area-wrapper">
                <div class="input-box">
                  <textarea id="userInput" placeholder="Ask anything... (پشتیبانی کامل از فارسی)" rows="1"></textarea>
                  <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                  <button class="stop-btn" id="stopButton" onclick="stopGenerating()">■</button>
                </div>
              </div>
            </div>

          <script>
            marked.setOptions({
              gfm: true, breaks: true,
              highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
              }
            });

            function renderInto(el, text, opts = {}) {
              // Ensure <think> tags are well-formed for DeepSeek
              let processedText = text;
              const openCount = (processedText.match(/<think>/g) || []).length;
              const closeCount = (processedText.match(/<\/think>/g) || []).length;
              if (openCount > closeCount) { processedText += '</think>'; }

              el.innerHTML = DOMPurify.sanitize(marked.parse(processedText), { ADD_TAGS: ['think'] }) + (opts.loading ? '<span class="loading-dots"></span>' : '');
              
              if (!opts.loading) {
                el.querySelectorAll('pre').forEach(pre => {
                  if (pre.querySelector('.copy-btn')) return;
                  const btn = document.createElement('button'); btn.className = 'copy-btn'; btn.textContent = 'Copy';
                  btn.onclick = () => { 
                    navigator.clipboard.writeText(pre.innerText.replace(/^Copy\s*/, '')).then(() => { 
                      btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); 
                    }); 
                  };
                  pre.appendChild(btn);
                });
              }
            }

            const elements = {
              chat: document.getElementById('chatContainer'),
              input: document.getElementById('userInput'),
              send: document.getElementById('sendButton'),
              stop: document.getElementById('stopButton'),
              temp: document.getElementById('temperature'),
              tempVal: document.getElementById('tempVal')
            };

            let state = { history: [], streaming: false, controller: null };

            renderInto(document.getElementById('welcomeMsg'), "System ready. Local inference engine **__MODEL_NAME__** is online. \n\n*Strict logic and native language generation rules are actively enforced.*");

            elements.input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 200) + 'px'; });
            elements.input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
            elements.temp.addEventListener('input', function() { elements.tempVal.textContent = this.value; });

            async function checkHealth() {
              try {
                const r = await fetch('/api/health');
                document.getElementById('statusIndicator').innerHTML = r.ok ? '<span class="status-dot ok"></span>System Online' : '<span class="status-dot bad"></span>Offline';
              } catch { document.getElementById('statusIndicator').innerHTML = '<span class="status-dot bad"></span>Offline'; }
            }
            setInterval(checkHealth, 10000); checkHealth();

            function appendMessage(role, content, isLoading = false) {
              const row = document.createElement('div'); row.className = `message-row ${role}`;
              const inner = document.createElement('div'); inner.className = 'message-inner';
              const avatar = document.createElement('div'); avatar.className = `avatar ${role}`; avatar.textContent = role === 'user' ? 'U' : '✦';
              const body = document.createElement('div'); body.className = 'message-body';
              inner.append(avatar, body); row.appendChild(inner); elements.chat.appendChild(row);
              renderInto(body, content, { loading: isLoading });
              elements.chat.scrollTop = elements.chat.scrollHeight;
              return body;
            }

            function clearChat() {
              const rows = elements.chat.querySelectorAll('.message-row');
              for (let i = 1; i < rows.length; i++) rows[i].remove();
              state.history = [];
            }

            function stopGenerating() { if (state.controller) state.controller.abort(); }

            async function sendMessage() {
              if (state.streaming || !elements.input.value.trim()) return;
              const text = elements.input.value.trim();
              
              appendMessage('user', text);
              state.history.push({ role: 'user', content: text });
              elements.input.value = ''; elements.input.style.height = 'auto';
              
              elements.send.style.display = 'none'; elements.stop.style.display = 'flex';
              state.streaming = true; state.controller = new AbortController();
              
              appendMessage('assistant', '', true);
              let fullContent = '';
              
              try {
                const res = await fetch('/api/chat', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: state.controller.signal,
                  body: JSON.stringify({ messages: state.history, temperature: parseFloat(elements.temp.value) })
                });
                
                const reader = res.body.getReader(); const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                  const { done, value } = await reader.read(); if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n'); buffer = lines.pop() || '';
                  
                  for (const line of lines) {
                    if (!line.startsWith('data: ') || line.includes('[DONE]')) continue;
                    try {
                      const data = JSON.parse(line.slice(6));
                      if (data.content !== undefined) {
                        fullContent += data.content;
                        const rows = elements.chat.querySelectorAll('.message-row.assistant');
                        renderInto(rows[rows.length - 1].querySelector('.message-body'), fullContent, { loading: true });
                        elements.chat.scrollTop = elements.chat.scrollHeight;
                      }
                    } catch {}
                  }
                }
              } catch (e) {
                if (e.name !== 'AbortError') fullContent += '\n\n`[Connection Error]`';
              }
              
              const rows = elements.chat.querySelectorAll('.message-row.assistant');
              renderInto(rows[rows.length - 1].querySelector('.message-body'), fullContent, { loading: false });
              
              if (fullContent) state.history.push({ role: 'assistant', content: fullContent });
              
              elements.send.style.display = 'flex'; elements.stop.style.display = 'none';
              state.streaming = false; state.controller = null; elements.input.focus();
            }
          </script>
          </body>
          </html>
          '''
          
          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="warning")
          PYEOF
          
      - name: 🌐 Start web server
        run: |
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}/api/health" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/webui.log
          exit 1

      - name: 📦 Install cloudflared
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: 🌐 Create tunnel and wait
        run: |
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          
          echo "⏳ Requesting Cloudflare Tunnel URL..."
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            cat tunnel.log && exit 1
          fi
          
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║              🎉  Y O U R   L L M   I S   R E A D Y  🎉             ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          
          {
            echo "## 🧠 Your DeepSeek / Qwen UI is live"
            echo "**URL:** $TUNNEL_URL"
            echo "**Model:** \`${MODEL_NAME}\`  |  **Context:** ${CONTEXT_SIZE} tokens"
          } >> "$GITHUB_STEP_SUMMARY"
          
          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
