name: Run MeTube with TryCloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create docker-compose.yml
        run: |
          cat > docker-compose.yml << 'EOF'
          services:
            metube:
              image: ghcr.io/alexta69/metube:latest
              container_name: metube
              restart: unless-stopped
              ports:
                - "8081:8081"
              volumes:
                - ./downloads:/downloads
              environment:
                - TZ=UTC
                - HOST=0.0.0.0
                - MAX_CONCURRENT_DOWNLOADS=3
                - DEFAULT_THEME=dark
                - LOGLEVEL=INFO
          EOF

      - name: Start MeTube
        run: |
          docker compose up -d
          echo "Waiting for MeTube to start..."
          sleep 5
          docker logs metube

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Run tunnel and capture URL
        id: tunnel
        run: |
          # Start cloudflared in background
          cloudflared tunnel --url http://127.0.0.1:8081 --protocol http2 2>&1 | tee cloudflared.log &
          CLOUDFLARED_PID=$!
          
          # Wait for the URL pattern (more flexible pattern)
          echo "Waiting for tunnel URL..."
          TIMEOUT=45
          TUNNEL_URL=""
          
          while [ $TIMEOUT -gt 0 ]; do
            if grep -q "trycloudflare.com" cloudflared.log; then
              # Try multiple patterns to extract URL
              TUNNEL_URL=$(grep -E 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1 | grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com')
              if [ -n "$TUNNEL_URL" ]; then
                echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
                echo "✅ Tunnel URL: $TUNNEL_URL"
                break
              fi
            fi
            sleep 2
            TIMEOUT=$((TIMEOUT-2))
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Failed to get tunnel URL, showing log:"
            cat cloudflared.log
            # Don't exit, just continue
          fi
          
          echo "🔄 Tunnel is running. Press Ctrl+C to stop."
          echo "📋 URL: $TUNNEL_URL"
          echo "⏱️  This will run for up to 6 hours"
          echo ""
          echo "⚠️  IMPORTANT: This tunnel is temporary and public!"
          echo ""
          
          # Keep running
          wait $CLOUDFLARED_PID

      - name: Display tunnel URL
        if: always() && steps.tunnel.outputs.TUNNEL_URL != ''
        run: |
          echo "========================================="
          echo "🔗 TUNNEL URL: ${{ steps.tunnel.outputs.TUNNEL_URL }}"
          echo "========================================="
          echo ""
          echo "⚠️  This URL is only valid while this workflow is running."
          echo ""
          echo "📁 Downloads are stored in: ./downloads (ephemeral)"
          echo ""
          echo "🛑 To stop: Cancel this workflow from GitHub Actions tab"

      - name: Show error if tunnel failed
        if: always() && steps.tunnel.outputs.TUNNEL_URL == ''
        run: |
          echo "========================================="
          echo "❌ TUNNEL CREATION FAILED"
          echo "========================================="
          echo ""
          echo "The tunnel was created but the URL couldn't be captured."
          echo "Check the logs above for the URL, or try:"
          echo ""
          echo "1. Check cloudflared.log in the workflow run"
          echo "2. Look for lines containing 'trycloudflare.com'"
          echo "3. Copy the URL manually from the logs"
