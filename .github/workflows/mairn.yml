name: 🦙 Llama 1B Web Interface

on:
  workflow_dispatch:
    inputs:
      model:
        description: '📦 Model to download from Ollama (Weak to Powerful)'
        required: false
        default: 'qwen2.5:0.5b'
        type: choice
        options:
          # Ultra-Lightweight & Fast (0.5B - 2B)
          - 'qwen2.5:0.5b'
          - 'qwen2.5:1.5b'
          - 'llama3.2:1b'
          - 'tinyllama:1.1b'
          - 'gemma:2b'
          - 'stablelm2:1.6b'
          - 'granite3-dense:2b'
          - 'deepseek-r1:1.5b'
          - 'qwen2.5:3b'
          - 'llama3.2:3b'
          # Mid-Range Performance (3B - 8B)
          - 'phi3:mini'
          - 'gemma2:2b'
          - 'gemma2:9b'
          - 'mistral:7b'
          - 'llama3.1:8b'
          - 'qwen2.5:7b'
          - 'phi3:14b'
          - 'deepseek-r1:7b'
          - 'deepseek-r1:8b'
          - 'codellama:7b'
          - 'codellama:13b'
          - 'llama3:8b'
          - 'minicpm-v:8b'
          - 'solar:10.7b'
          - 'aya:8b'
          # High-Performance / Large Models (12B - 70B+)
          - 'mistral-nemo:12b'
          - 'qwen2.5:14b'
          - 'phi4:14b'
          - 'deepseek-r1:14b'
          - 'gemma2:27b'
          - 'command-r:35b'
          - 'qwen2.5:32b'
          - 'deepseek-r1:32b'
          - 'mixtral:8x7b'
          - 'glm4:9b'
          - 'llama3.1:70b'
          - 'llama3:70b'
          - 'llama3.3:70b'
          - 'qwen2.5:72b'
          - 'deepseek-r1:70b'
          - 'mixtral:8x22b'
          - 'command-r-plus:104b'
          - 'deepseek-r1:671b'
          - 'vicuna:7b'
          - 'vicuna:13b'
          - 'wizardlm2:7b'
          - 'wizardlm2:8b'
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context size (tokens)'
        required: false
        default: '4096'
        type: string

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🦙 Show Banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║            🦙  C L A U D E - S T Y L E   L L A M A   U I          ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  📦 Model: ${{ github.event.inputs.model }}"
          echo "  📝 Context: ${{ github.event.inputs.context_size }} tokens"
          echo "  🔌 Port: ${{ github.event.inputs.port }}"
          echo "  🏃 Runner: $(uname -a)"
          echo "  💾 Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "  🧠 CPU: $(nproc) cores"
          echo ""

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing required packages"
          echo "──────────────────────────────────────────"
          
          # Install Ollama
          echo "🔧 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Install Python packages
          echo "🐍 Installing Python packages..."
          pip install --no-cache-dir \
            fastapi \
            uvicorn \
            aiohttp \
            httpx \
            python-multipart \
            jinja2 \
            websockets \
            pydantic

          ollama --version || echo "⚠️ Ollama version check"
          python --version
          echo "✅ Dependencies installed!"

      - name: 🚀 Start Ollama Server First
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama server in background"
          echo "──────────────────────────────────────────"
          
          ollama serve &
          
          echo "⏳ Waiting for Ollama service to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              break
            fi
            sleep 2
          done

      - name: 📥 Download Model from Ollama
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Downloading model: ${{ github.event.inputs.model }}"
          echo "──────────────────────────────────────────"
          
          MODEL="${{ github.event.inputs.model }}"
          
          echo "⏳ This may take 3-15 minutes depending on model size..."
          echo ""
          ollama pull "$MODEL"
          echo ""
          echo "✅ Model downloaded successfully!"
          echo "📊 Installed models:"
          ollama list

      - name: 🔧 Create Ollama Server Script
        run: |
          cat > ollama_server.py << 'EOF'
          #!/usr/bin/env python3
          """
          🦙 Ollama Web Server - Claude UI Styling with Markdown & Code Highlights
          """
          
          import json
          import asyncio
          import subprocess
          import shutil
          from pathlib import Path
          from typing import Optional, Dict, List, Any
          from fastapi import FastAPI, HTTPException, Request
          from fastapi.responses import HTMLResponse, JSONResponse, StreamingResponse
          from pydantic import BaseModel
          import uvicorn
          import httpx
          import logging
          import os
          
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          
          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          MODEL_NAME = os.getenv("MODEL_NAME", "qwen2.5:0.5b")
          PORT = int(os.getenv("PORT", "7860"))
          
          app = FastAPI(title="Claude Local UI", description="Local LLM Interface")
          
          class ChatMessage(BaseModel):
              role: str
              content: str
          
          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048
              stream: Optional[bool] = True
          
          HTML_TEMPLATE = '''
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Claude - Local LLM</title>
              <!-- Marked.js for Markdown -->
              <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
              <!-- Highlight.js for Code Highlighting -->
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
              <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
              <style>
                  :root {
                      --claude-bg: #fdfbf7;
                      --claude-sidebar: #f4efe6;
                      --claude-border: #e6dfd5;
                      --claude-text: #383735;
                      --claude-text-secondary: #73716b;
                      --claude-accent: #cc785c;
                      --claude-user-bg: #f4efe6;
                      --claude-assistant-bg: #ffffff;
                      --claude-input-bg: #ffffff;
                  }
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      background: var(--claude-bg);
                      color: var(--claude-text);
                      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                      height: 100vh;
                      display: flex;
                      overflow: hidden;
                  }
                  .sidebar {
                      width: 280px;
                      background: var(--claude-sidebar);
                      border-right: 1px solid var(--claude-border);
                      display: flex;
                      flex-direction: column;
                      padding: 16px;
                      flex-shrink: 0;
                  }
                  .new-chat-btn {
                      display: flex;
                      align-items: center;
                      gap: 10px;
                      width: 100%;
                      padding: 10px 14px;
                      background: #ffffff;
                      border: 1px solid var(--claude-border);
                      border-radius: 8px;
                      color: var(--claude-text);
                      font-size: 14px;
                      font-weight: 500;
                      cursor: pointer;
                      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
                      transition: background 0.2s, border-color 0.2s;
                      margin-bottom: 20px;
                  }
                  .new-chat-btn:hover {
                      background: #faf8f5;
                      border-color: #d1c7bc;
                  }
                  .sidebar-footer {
                      margin-top: auto;
                      border-top: 1px solid var(--claude-border);
                      padding-top: 14px;
                      font-size: 13px;
                      color: var(--claude-text-secondary);
                      display: flex;
                      flex-direction: column;
                      gap: 8px;
                  }
                  .model-tag {
                      background: rgba(204, 120, 92, 0.12);
                      color: var(--claude-accent);
                      padding: 4px 8px;
                      border-radius: 6px;
                      font-size: 12px;
                      font-weight: 600;
                      width: fit-content;
                  }
                  .main-content {
                      flex: 1;
                      display: flex;
                      flex-direction: column;
                      height: 100vh;
                      position: relative;
                      background: var(--claude-bg);
                  }
                  .chat-container {
                      flex: 1;
                      overflow-y: auto;
                      display: flex;
                      flex-direction: column;
                      padding: 20px 0 140px 0;
                      scroll-behavior: smooth;
                  }
                  .message-row {
                      width: 100%;
                      display: flex;
                      justify-content: center;
                      padding: 24px 16px;
                      border-bottom: 1px solid rgba(230, 223, 213, 0.4);
                  }
                  .message-row.user {
                      background: var(--claude-user-bg);
                  }
                  .message-row.assistant {
                      background: var(--claude-assistant-bg);
                  }
                  .message-inner {
                      max-width: 768px;
                      width: 100%;
                      display: flex;
                      gap: 16px;
                      line-height: 1.7;
                      font-size: 15px;
                  }
                  .avatar {
                      width: 32px;
                      height: 32px;
                      border-radius: 50%;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-size: 15px;
                      flex-shrink: 0;
                  }
                  .avatar.user { background: #383735; color: #fff; }
                  .avatar.assistant { background: var(--claude-accent); color: #fff; }
                  .message-body {
                      flex: 1;
                      overflow-x: auto;
                  }
                  
                  /* Markdown Customization for Claude Theme */
                  .message-body p { margin-bottom: 12px; }
                  .message-body p:last-child { margin-bottom: 0; }
                  .message-body pre {
                      background: #1e1e1e;
                      color: #d4d4d4;
                      padding: 14px;
                      border-radius: 8px;
                      overflow-x: auto;
                      margin: 12px 0;
                      border: 1px solid #333;
                  }
                  .message-body code {
                      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                      font-size: 13px;
                      background: rgba(0,0,0,0.06);
                      padding: 2px 5px;
                      border-radius: 4px;
                  }
                  .message-body pre code {
                      background: transparent;
                      padding: 0;
                      color: inherit;
                  }
                  .message-body ul, .message-body ol {
                      padding-left: 22px;
                      margin-bottom: 12px;
                  }
                  .message-body blockquote {
                      border-left: 3px solid var(--claude-accent);
                      padding-left: 12px;
                      color: var(--claude-text-secondary);
                      margin: 12px 0;
                  }
                  .message-body table {
                      width: 100%;
                      border-collapse: collapse;
                      margin: 12px 0;
                  }
                  .message-body th, .message-body td {
                      border: 1px solid var(--claude-border);
                      padding: 8px 12px;
                      text-align: left;
                  }
                  .message-body th {
                      background: var(--claude-sidebar);
                  }

                  .input-area-wrapper {
                      position: absolute;
                      bottom: 0;
                      left: 0;
                      width: 100%;
                      background: linear-gradient(180deg, rgba(253,251,247,0) 0%, var(--claude-bg) 40%);
                      padding: 20px 24px 28px 24px;
                      display: flex;
                      justify-content: center;
                  }
                  .input-box {
                      max-width: 768px;
                      width: 100%;
                      background: var(--claude-input-bg);
                      border: 1px solid var(--claude-border);
                      border-radius: 12px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
                      display: flex;
                      align-items: flex-end;
                      padding: 12px 16px;
                      gap: 12px;
                  }
                  .input-box textarea {
                      flex: 1;
                      background: transparent;
                      border: none;
                      color: var(--claude-text);
                      font-family: inherit;
                      font-size: 15px;
                      resize: none;
                      outline: none;
                      max-height: 200px;
                      min-height: 24px;
                      line-height: 24px;
                  }
                  .input-box textarea::placeholder {
                      color: #a8a29e;
                  }
                  .send-btn {
                      background: var(--claude-accent);
                      border: none;
                      border-radius: 8px;
                      width: 36px;
                      height: 36px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      color: white;
                      cursor: pointer;
                      transition: opacity 0.2s, transform 0.1s;
                      flex-shrink: 0;
                  }
                  .send-btn:hover {
                      opacity: 0.9;
                  }
                  .send-btn:active {
                      transform: scale(0.95);
                  }
                  .send-btn:disabled {
                      opacity: 0.3;
                      cursor: not-allowed;
                  }
                  .loading-dots::after {
                      content: '...';
                      animation: dots 1.5s steps(4, end) infinite;
                  }
                  @keyframes dots {
                      0% { content: ''; }
                      25% { content: '.'; }
                      50% { content: '..'; }
                      75% { content: '...'; }
                  }
                  .settings-group {
                      display: flex;
                      flex-direction: column;
                      gap: 10px;
                      font-size: 13px;
                      color: var(--claude-text-secondary);
                      margin-top: 10px;
                  }
                  .settings-group label {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                  }
                  .settings-group input[type="range"] {
                      width: 130px;
                      accent-color: var(--claude-accent);
                  }
              </style>
          </head>
          <body>
              <div class="sidebar">
                  <button class="new-chat-btn" onclick="clearChat()">
                      <span>＋</span> Start New Chat
                  </button>
                  <div class="settings-group">
                      <label>Temperature: <span id="tempVal">0.7</span></label>
                      <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                      <label>Max Tokens: <span id="tokenVal">2048</span></label>
                      <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
                  </div>
                  <div class="sidebar-footer">
                      <span class="model-tag">📦 {{ model_name }}</span>
                      <span id="statusIndicator">🟢 Ollama Ready</span>
                      <span id="tokenCounter">Tokens consumed: 0</span>
                  </div>
              </div>

              <div class="main-content">
                  <div class="chat-container" id="chatContainer">
                      <div class="message-row assistant">
                          <div class="message-inner">
                              <div class="avatar assistant">✨</div>
                              <div class="message-body" id="welcomeMsg"></div>
                          </div>
                      </div>
                  </div>

                  <div class="input-area-wrapper">
                      <div class="input-box">
                          <textarea id="userInput" placeholder="Reply to Claude..." rows="1"></textarea>
                          <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                      </div>
                  </div>
              </div>

              <script>
                  marked.setOptions({
                      highlight: function(code, lang) {
                          if (lang && hljs.getLanguage(lang)) {
                              return hljs.highlight(code, { language: lang }).value;
                          }
                          return hljs.highlightAuto(code).value;
                      },
                      breaks: true
                  });

                  document.getElementById('welcomeMsg').innerHTML = marked.parse("Hello! I am **{{ model_name }}** running locally. How can I help you today?");

                  const chatContainer = document.getElementById('chatContainer');
                  const userInput = document.getElementById('userInput');
                  const sendButton = document.getElementById('sendButton');
                  const tokenCounter = document.getElementById('tokenCounter');
                  let isStreaming = false;
                  let totalTokens = 0;
                  let messageHistory = [];

                  userInput.addEventListener('input', function() {
                      this.style.height = 'auto';
                      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
                  });

                  userInput.addEventListener('keydown', function(e) {
                      if (e.key === 'Enter' && !e.shiftKey) {
                          e.preventDefault();
                          sendMessage();
                      }
                  });

                  document.getElementById('temperature').addEventListener('input', function() {
                      document.getElementById('tempVal').textContent = this.value;
                  });
                  document.getElementById('maxTokens').addEventListener('input', function() {
                      document.getElementById('tokenVal').textContent = this.value;
                  });

                  function appendMessage(role, content, isLoading = false) {
                      const row = document.createElement('div');
                      row.className = `message-row ${role}`;
                      
                      const inner = document.createElement('div');
                      inner.className = 'message-inner';

                      const avatar = document.createElement('div');
                      avatar.className = `avatar ${role}`;
                      avatar.textContent = role === 'user' ? 'You' : '✨';

                      const body = document.createElement('div');
                      body.className = 'message-body';
                      if (isLoading) {
                          body.innerHTML = marked.parse(content) + '<span class="loading-dots"></span>';
                      } else {
                          body.innerHTML = marked.parse(content);
                      }

                      inner.appendChild(avatar);
                      inner.appendChild(body);
                      row.appendChild(inner);
                      chatContainer.appendChild(row);
                      chatContainer.scrollTop = chatContainer.scrollHeight;
                      return body;
                  }

                  function updateLastMessage(content, isComplete = false) {
                      const rows = chatContainer.querySelectorAll('.message-row.assistant');
                      if (rows.length === 0) return;
                      const lastRow = rows[rows.length - 1];
                      const body = lastRow.querySelector('.message-body');
                      if (body) {
                          if (isComplete) {
                              body.innerHTML = marked.parse(content);
                              body.querySelectorAll('pre code').forEach((block) => {
                                  hljs.highlightElement(block);
                              });
                          } else {
                              body.innerHTML = marked.parse(content) + '<span class="loading-dots"></span>';
                          }
                          chatContainer.scrollTop = chatContainer.scrollHeight;
                      }
                  }

                  function clearChat() {
                      const rows = chatContainer.querySelectorAll('.message-row');
                      for (let i = 1; i < rows.length; i++) {
                          rows[i].remove();
                      }
                      messageHistory = [];
                      totalTokens = 0;
                      tokenCounter.textContent = 'Tokens consumed: 0';
                  }

                  async function sendMessage() {
                      if (isStreaming) return;
                      const text = userInput.value.trim();
                      if (!text) return;

                      appendMessage('user', text);
                      messageHistory.push({ role: 'user', content: text });
                      
                      userInput.value = '';
                      userInput.style.height = 'auto';
                      sendButton.disabled = true;
                      isStreaming = true;

                      appendMessage('assistant', 'Thinking', true);

                      try {
                          const temperature = parseFloat(document.getElementById('temperature').value);
                          const maxTokens = parseInt(document.getElementById('maxTokens').value);

                          const response = await fetch('/api/chat', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({
                                  messages: messageHistory,
                                  temperature: temperature,
                                  max_tokens: maxTokens,
                                  stream: true
                              })
                          });

                          if (!response.ok) throw new Error('Network response error');

                          const reader = response.body.getReader();
                          const decoder = new TextDecoder();
                          let fullContent = '';
                          let buffer = '';

                          while (true) {
                              const { done, value } = await reader.read();
                              if (done) break;

                              buffer += decoder.decode(value, { stream: true });
                              const lines = buffer.split('\n');
                              buffer = lines.pop() || '';

                              for (const line of lines) {
                                  if (line.startsWith('data: ')) {
                                      const data = line.slice(6);
                                      if (data === '[DONE]') continue;
                                      try {
                                          const parsed = JSON.parse(data);
                                          if (parsed.content) {
                                              fullContent += parsed.content;
                                              updateLastMessage(fullContent, false);
                                          }
                                      } catch (e) {}
                                  }
                              }
                          }
                          updateLastMessage(fullContent, true);
                          messageHistory.push({ role: 'assistant', content: fullContent });
                          totalTokens += Math.ceil(fullContent.length / 4);
                          tokenCounter.textContent = `Tokens consumed: ${totalTokens}`;
                      } catch (error) {
                          updateLastMessage('❌ Error generating response.', true);
                      }

                      sendButton.disabled = false;
                      isStreaming = false;
                      userInput.focus();
                  }
              </script>
          </body>
          </html>
          '''

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE.replace("{{ model_name }}", MODEL_NAME).replace("{{ context_size }}", str(CONTEXT_SIZE))

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              try:
                  ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]
                  async def generate():
                      try:
                          async with httpx.AsyncClient(timeout=120) as client:
                              async with client.stream(
                                  "POST",
                                  f"{OLLAMA_HOST}/api/chat",
                                  json={
                                      "model": MODEL_NAME,
                                      "messages": ollama_messages,
                                      "stream": True,
                                      "options": {
                                          "temperature": request.temperature,
                                          "num_predict": request.max_tokens,
                                          "num_ctx": CONTEXT_SIZE
                                      }
                                  }
                              ) as response:
                                  async for chunk in response.aiter_bytes():
                                      try:
                                          data = chunk.decode('utf-8').strip()
                                          if data:
                                              for line in data.split('\n'):
                                                  if line.strip():
                                                      json_data = json.loads(line)
                                                      if "message" in json_data and "content" in json_data["message"]:
                                                          yield f"data: {json.dumps({'content': json_data['message']['content']})}\n\n"
                                      except:
                                          continue
                      except Exception as e:
                          yield f"data: {json.dumps({'error': str(e)})}\n\n"
                      yield "data: [DONE]\n\n"

                  return StreamingResponse(generate(), media_type="text/event-stream")
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          EOF
          
          echo "✅ Server script created!"

      - name: 🔧 Start Web Server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting Web UI server"
          echo "──────────────────────────────────────────"
          
          export MODEL_NAME="${{ github.event.inputs.model }}"
          export CONTEXT_SIZE="${{ github.event.inputs.context_size }}"
          export PORT="${{ github.event.inputs.port }}"
          
          python ollama_server.py &
          
          echo "⏳ Waiting for web server to start..."
          for i in {1..15}; do
            if curl -s http://localhost:${{ github.event.inputs.port }} > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              break
            fi
            sleep 2
          done

      - name: 📦 Install Cloudflared
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Cloudflared"
          echo "──────────────────────────────────────────"
          
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: 🌐 Create Tunnel
        id: tunnel
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          
          PORT="${{ github.event.inputs.port }}"
          
          cloudflared tunnel --url http://127.0.0.1:$PORT --protocol http2 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          COUNTER=0
          
          while [ -z "$TUNNEL_URL" ] && [ $COUNTER -lt 60 ]; do
            if [ -f tunnel.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            fi
            sleep 2
            COUNTER=$((COUNTER + 2))
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║            🎉  L L A M A   I S   R E A D Y !  🎉                  ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          if [ -n "$TUNNEL_URL" ]; then
            echo "║  🔗  TUNNEL URL:  $TUNNEL_URL"
          else
            echo "║  ⚠️  Check logs above for the tunnel URL"
          fi
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          
          wait $TUNNEL_PID

      - name: Display Final URL
        if: always() && env.TUNNEL_URL != ''
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  🔗  ACCESS YOUR CLAUDE LLAMA UI:"
          echo "  📌  ${{ env.TUNNEL_URL }}"
          echo "═══════════════════════════════════════════════════════════════════"

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          echo "✅ Cleanup complete"
