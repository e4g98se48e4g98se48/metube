name: MeTube with Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Start MeTube Container
        run: |
          echo "🚀 Starting MeTube..."
          docker run -d \
            --name metube \
            --restart unless-stopped \
            -p 8081:8081 \
            -e HOST=0.0.0.0 \
            -e MAX_CONCURRENT_DOWNLOADS=3 \
            -e DEFAULT_THEME=dark \
            -e LOGLEVEL=INFO \
            ghcr.io/alexta69/metube:latest
          
          # Wait for MeTube to be ready
          echo "⏳ Waiting for MeTube to start..."
          for i in {1..10}; do
            if docker logs metube 2>&1 | grep -q "Listening on"; then
              echo "✅ MeTube is ready!"
              break
            fi
            sleep 2
          done
          
          # Show MeTube is running
          docker ps | grep metube
          docker logs metube

      - name: Install cloudflared
        run: |
          echo "📦 Installing cloudflared..."
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Create Tunnel and Display URL
        id: tunnel
        run: |
          echo "🌐 Creating Cloudflare tunnel..."
          
          # Start tunnel in background with logging
          cloudflared tunnel --url http://127.0.0.1:8081 --protocol http2 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          # Extract URL with robust pattern matching
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          COUNTER=0
          
          while [ -z "$TUNNEL_URL" ] && [ $COUNTER -lt 60 ]; do
            if [ -f tunnel.log ]; then
              # Try multiple patterns to catch the URL
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
              if [ -z "$TUNNEL_URL" ]; then
                TUNNEL_URL=$(grep -oE 'https://[^ ]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
              fi
              if [ -z "$TUNNEL_URL" ]; then
                TUNNEL_URL=$(grep -oE 'trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
                if [ -n "$TUNNEL_URL" ]; then
                  # Extract from the line if we found the domain
                  TUNNEL_URL=$(grep "trycloudflare.com" tunnel.log | grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' | head -1)
                fi
              fi
            fi
            sleep 2
            COUNTER=$((COUNTER + 2))
          done
          
          # Save URL for later steps
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
            echo "✅ Tunnel URL captured: $TUNNEL_URL"
          else
            echo "⚠️ Could not auto-capture URL, check logs below:"
            cat tunnel.log
          fi
          
          # Display beautiful banner with URL
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                                                              ║"
          echo "║         🎉 M e T u b e   i s   R e a d y ! 🎉               ║"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          if [ -n "$TUNNEL_URL" ]; then
            echo "║  🔗 Tunnel URL: $TUNNEL_URL"
          else
            echo "║  ⚠️ Check logs above for the tunnel URL"
          fi
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  ⏱️  Tunnel expires in: ~6 hours (GitHub Action limit)      ║"
          echo "║  📁 Downloads: Ephemeral (deleted when workflow stops)     ║"
          echo "║  🌐 Public: Anyone with URL can access                    ║"
          echo "║                                                              ║"
          echo "║  🛑 To stop: Cancel workflow in GitHub Actions tab         ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "💡 Tip: Bookmark this URL or copy it now!"
          echo ""
          
          # Keep the tunnel running
          echo "🔄 Tunnel is running. Press Ctrl+C to stop."
          wait $TUNNEL_PID

      - name: Display URL (if workflow continues)
        if: always() && env.TUNNEL_URL != ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  🔗  ACCESS YOUR METUBE INSTANCE AT:"
          echo "  📌  ${{ env.TUNNEL_URL }}"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  ⚠️  This URL is temporary and will expire when this workflow stops"
          echo "  📂  Downloads are in: ./downloads (deleted after workflow ends)"
          echo "  🔒  No authentication - anyone with the URL can access"
          echo ""
          echo "  🛑  To stop: https://github.com/${{ github.repository }}/actions"
          echo ""

      - name: Fallback - Show URL from logs
        if: failure() || env.TUNNEL_URL == ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  ⚠️  AUTO-EXTRACTION FAILED - FIND URL MANUALLY"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🔍 Look for 'trycloudflare.com' in the logs above"
          echo "  📝 The URL format is: https://[random-words].trycloudflare.com"
          echo ""
          echo "  📋 Search for lines containing:"
          echo "     - 'Your quick Tunnel has been created'"
          echo "     - 'trycloudflare.com'"
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
