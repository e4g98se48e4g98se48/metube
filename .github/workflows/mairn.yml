name: 🦙 Llama Web Interface

on:
  workflow_dispatch:
    inputs:
      model:
        description: '📦 Model to download'
        required: false
        default: 'qwen2.5:0.5b'
        type: choice
        options:
          - 'qwen2.5:0.5b'
          - 'qwen2.5:1.5b'
          - 'llama3.2:1b'
          - 'llama3.2:3b'
          - 'phi3:mini'
          - 'mistral:7b'
          - 'llama3.1:8b'
          - 'llama3:8b'
          - 'llama3.1:70b'
          - 'llama3.3:70b'
          - 'qwen2.5:32b'
          - 'deepseek-r1:7b'
          - 'deepseek-r1:14b'
          - 'deepseek-r1:32b'
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context size'
        required: false
        default: '4096'
        type: string

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🦙 Show Banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║            🦙  L L A M A   W E B   I N T E R F A C E              ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  📦 Model: ${{ github.event.inputs.model }}"
          echo "  📝 Context: ${{ github.event.inputs.context_size }} tokens"
          echo "  🔌 Port: ${{ github.event.inputs.port }}"
          echo "  🏃 Runner: $(uname -a)"
          echo "  💾 Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "  🧠 CPU: $(nproc) cores"
          echo ""

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦 Installing required packages"
          echo "──────────────────────────────────────────"
          
          # Install Ollama
          echo "🔧 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Install Python packages
          echo "🐍 Installing Python packages..."
          pip install --no-cache-dir \
            fastapi \
            uvicorn[standard] \
            aiohttp \
            httpx \
            python-multipart \
            jinja2 \
            pydantic \
            websockets

          ollama --version || echo "⚠️ Ollama installed"
          python --version
          echo "✅ Dependencies installed!"

      - name: 🚀 Start Ollama Server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀 Starting Ollama server"
          echo "──────────────────────────────────────────"
          
          # Start Ollama in background
          ollama serve &
          
          # Wait for Ollama to be ready
          echo "⏳ Waiting for Ollama service..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              break
            fi
            sleep 2
          done

      - name: 📥 Download Model
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥 Downloading model: ${{ github.event.inputs.model }}"
          echo "──────────────────────────────────────────"
          
          MODEL="${{ github.event.inputs.model }}"
          
          echo "⏳ This may take 3-15 minutes..."
          ollama pull "$MODEL"
          
          echo ""
          echo "✅ Model downloaded successfully!"
          echo "📊 Installed models:"
          ollama list

      - name: 🔧 Create Web Server
        run: |
          cat > app.py << 'EOF'
          #!/usr/bin/env python3
          """
          🦙 Ollama Web Interface - Complete Fixed Version
          """
          
          import json
          import asyncio
          import os
          import logging
          from typing import List, Optional, AsyncGenerator
          from fastapi import FastAPI, HTTPException, Request
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel
          import uvicorn
          import httpx
          
          # Configure logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          
          # Environment variables
          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          MODEL_NAME = os.getenv("MODEL_NAME", "qwen2.5:0.5b")
          PORT = int(os.getenv("PORT", "7860"))
          
          app = FastAPI(title="Ollama Web UI")
          
          # Models
          class Message(BaseModel):
              role: str
              content: str
          
          class ChatRequest(BaseModel):
              messages: List[Message]
              temperature: float = 0.7
              max_tokens: int = 2048
              stream: bool = True
          
          # HTML Template - Complete Modern UI
          HTML_TEMPLATE = '''
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🦙 Ollama UI</title>
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
              <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
              <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  
                  :root {
                      --bg-primary: #0a0a0f;
                      --bg-secondary: #14141e;
                      --bg-card: #1a1a2e;
                      --bg-input: #1e1e32;
                      --text-primary: #e4e4e7;
                      --text-secondary: #a0a0b8;
                      --accent: #6c5ce7;
                      --accent-hover: #7d6ff0;
                      --accent-glow: rgba(108, 92, 231, 0.3);
                      --border-color: #2a2a44;
                      --user-bubble: #2d2d4a;
                      --assistant-bubble: #1a1a2e;
                      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
                  }
                  
                  body {
                      background: var(--bg-primary);
                      color: var(--text-primary);
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                      height: 100vh;
                      display: flex;
                      overflow: hidden;
                  }
                  
                  /* Sidebar */
                  .sidebar {
                      width: 280px;
                      background: var(--bg-secondary);
                      border-right: 1px solid var(--border-color);
                      display: flex;
                      flex-direction: column;
                      padding: 20px;
                      flex-shrink: 0;
                  }
                  
                  .sidebar-header {
                      display: flex;
                      align-items: center;
                      gap: 12px;
                      margin-bottom: 24px;
                  }
                  
                  .sidebar-header h1 {
                      font-size: 20px;
                      font-weight: 700;
                      background: linear-gradient(135deg, var(--accent), #a78bfa);
                      -webkit-background-clip: text;
                      -webkit-text-fill-color: transparent;
                  }
                  
                  .new-chat-btn {
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      gap: 10px;
                      width: 100%;
                      padding: 12px;
                      background: var(--accent);
                      border: none;
                      border-radius: 10px;
                      color: white;
                      font-size: 14px;
                      font-weight: 600;
                      cursor: pointer;
                      transition: all 0.3s ease;
                      margin-bottom: 20px;
                  }
                  
                  .new-chat-btn:hover {
                      background: var(--accent-hover);
                      transform: translateY(-1px);
                      box-shadow: 0 4px 20px var(--accent-glow);
                  }
                  
                  .settings-group {
                      background: var(--bg-card);
                      border-radius: 10px;
                      padding: 16px;
                      margin-bottom: 16px;
                  }
                  
                  .settings-group label {
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      font-size: 13px;
                      color: var(--text-secondary);
                      margin-bottom: 8px;
                  }
                  
                  .settings-group input[type="range"] {
                      width: 100%;
                      height: 4px;
                      -webkit-appearance: none;
                      background: var(--border-color);
                      border-radius: 2px;
                      outline: none;
                  }
                  
                  .settings-group input[type="range"]::-webkit-slider-thumb {
                      -webkit-appearance: none;
                      width: 16px;
                      height: 16px;
                      border-radius: 50%;
                      background: var(--accent);
                      cursor: pointer;
                      box-shadow: 0 0 20px var(--accent-glow);
                  }
                  
                  .sidebar-footer {
                      margin-top: auto;
                      padding-top: 16px;
                      border-top: 1px solid var(--border-color);
                  }
                  
                  .model-tag {
                      display: inline-block;
                      padding: 4px 12px;
                      background: var(--accent-glow);
                      color: var(--accent);
                      border-radius: 20px;
                      font-size: 12px;
                      font-weight: 600;
                      margin-bottom: 8px;
                  }
                  
                  .status-indicator {
                      display: flex;
                      align-items: center;
                      gap: 8px;
                      font-size: 13px;
                      color: var(--text-secondary);
                  }
                  
                  .status-dot {
                      width: 8px;
                      height: 8px;
                      border-radius: 50%;
                      background: #4ade80;
                      animation: pulse 2s infinite;
                  }
                  
                  @keyframes pulse {
                      0%, 100% { opacity: 1; }
                      50% { opacity: 0.3; }
                  }
                  
                  /* Main Content */
                  .main-content {
                      flex: 1;
                      display: flex;
                      flex-direction: column;
                      position: relative;
                  }
                  
                  .chat-container {
                      flex: 1;
                      overflow-y: auto;
                      padding: 20px 24px 160px 24px;
                      scroll-behavior: smooth;
                  }
                  
                  .message {
                      display: flex;
                      gap: 16px;
                      padding: 20px 0;
                      border-bottom: 1px solid var(--border-color);
                      animation: fadeIn 0.3s ease;
                  }
                  
                  @keyframes fadeIn {
                      from { opacity: 0; transform: translateY(10px); }
                      to { opacity: 1; transform: translateY(0); }
                  }
                  
                  .message-avatar {
                      width: 36px;
                      height: 36px;
                      border-radius: 50%;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      font-size: 16px;
                      flex-shrink: 0;
                  }
                  
                  .message-avatar.user {
                      background: var(--accent);
                  }
                  
                  .message-avatar.assistant {
                      background: var(--bg-card);
                      border: 1px solid var(--border-color);
                  }
                  
                  .message-content {
                      flex: 1;
                      line-height: 1.7;
                      font-size: 15px;
                      min-width: 0;
                  }
                  
                  .message-content pre {
                      background: #0d0d1a;
                      padding: 16px;
                      border-radius: 8px;
                      overflow-x: auto;
                      margin: 12px 0;
                      border: 1px solid var(--border-color);
                  }
                  
                  .message-content code {
                      font-family: 'Fira Code', 'Consolas', monospace;
                      font-size: 13px;
                  }
                  
                  .message-content p {
                      margin-bottom: 12px;
                  }
                  
                  .message-content p:last-child {
                      margin-bottom: 0;
                  }
                  
                  .message-content ul, .message-content ol {
                      padding-left: 24px;
                      margin-bottom: 12px;
                  }
                  
                  .message-content blockquote {
                      border-left: 3px solid var(--accent);
                      padding-left: 16px;
                      color: var(--text-secondary);
                      margin: 12px 0;
                  }
                  
                  /* Input Area */
                  .input-area {
                      position: absolute;
                      bottom: 0;
                      left: 0;
                      right: 0;
                      background: linear-gradient(180deg, transparent, var(--bg-primary) 30%);
                      padding: 20px 24px 24px 24px;
                  }
                  
                  .input-wrapper {
                      max-width: 768px;
                      margin: 0 auto;
                      background: var(--bg-card);
                      border: 1px solid var(--border-color);
                      border-radius: 12px;
                      padding: 12px 16px;
                      display: flex;
                      align-items: flex-end;
                      gap: 12px;
                      transition: border-color 0.3s ease;
                  }
                  
                  .input-wrapper:focus-within {
                      border-color: var(--accent);
                      box-shadow: 0 0 30px var(--accent-glow);
                  }
                  
                  .input-wrapper textarea {
                      flex: 1;
                      background: transparent;
                      border: none;
                      color: var(--text-primary);
                      font-family: inherit;
                      font-size: 15px;
                      resize: none;
                      outline: none;
                      max-height: 200px;
                      min-height: 24px;
                      line-height: 24px;
                  }
                  
                  .input-wrapper textarea::placeholder {
                      color: var(--text-secondary);
                  }
                  
                  .send-btn {
                      background: var(--accent);
                      border: none;
                      border-radius: 8px;
                      width: 40px;
                      height: 40px;
                      display: flex;
                      align-items: center;
                      justify-content: center;
                      color: white;
                      cursor: pointer;
                      transition: all 0.3s ease;
                      flex-shrink: 0;
                      font-size: 18px;
                  }
                  
                  .send-btn:hover:not(:disabled) {
                      background: var(--accent-hover);
                      transform: scale(1.05);
                      box-shadow: 0 4px 20px var(--accent-glow);
                  }
                  
                  .send-btn:disabled {
                      opacity: 0.4;
                      cursor: not-allowed;
                  }
                  
                  .typing-indicator {
                      display: flex;
                      gap: 4px;
                      padding: 4px 0;
                  }
                  
                  .typing-dot {
                      width: 6px;
                      height: 6px;
                      border-radius: 50%;
                      background: var(--text-secondary);
                      animation: typingBounce 1.4s infinite;
                  }
                  
                  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
                  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
                  
                  @keyframes typingBounce {
                      0%, 60%, 100% { transform: translateY(0); }
                      30% { transform: translateY(-6px); }
                  }
                  
                  /* Scrollbar */
                  .chat-container::-webkit-scrollbar {
                      width: 4px;
                  }
                  
                  .chat-container::-webkit-scrollbar-track {
                      background: transparent;
                  }
                  
                  .chat-container::-webkit-scrollbar-thumb {
                      background: var(--border-color);
                      border-radius: 2px;
                  }
                  
                  .chat-container::-webkit-scrollbar-thumb:hover {
                      background: var(--accent);
                  }
                  
                  /* Mobile Responsive */
                  @media (max-width: 768px) {
                      .sidebar {
                          display: none;
                      }
                      
                      .chat-container {
                          padding: 12px 16px 140px 16px;
                      }
                      
                      .input-area {
                          padding: 12px 16px 16px 16px;
                      }
                  }
              </style>
          </head>
          <body>
              <!-- Sidebar -->
              <div class="sidebar">
                  <div class="sidebar-header">
                      <h1>🦙 Ollama</h1>
                  </div>
                  
                  <button class="new-chat-btn" onclick="clearChat()">
                      ✨ New Chat
                  </button>
                  
                  <div class="settings-group">
                      <label>
                          Temperature
                          <span id="tempValue">0.7</span>
                      </label>
                      <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                  </div>
                  
                  <div class="settings-group">
                      <label>
                          Max Tokens
                          <span id="tokenValue">2048</span>
                      </label>
                      <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
                  </div>
                  
                  <div class="sidebar-footer">
                      <div class="model-tag">📦 {{ model_name }}</div>
                      <div class="status-indicator">
                          <span class="status-dot"></span>
                          <span>Ready</span>
                      </div>
                      <div style="font-size:12px;color:var(--text-secondary);margin-top:8px;">
                          Tokens: <span id="tokenCounter">0</span>
                      </div>
                  </div>
              </div>
              
              <!-- Main Content -->
              <div class="main-content">
                  <div class="chat-container" id="chatContainer">
                      <!-- Welcome Message -->
                      <div class="message">
                          <div class="message-avatar assistant">🦙</div>
                          <div class="message-content" id="welcomeMessage"></div>
                      </div>
                  </div>
                  
                  <div class="input-area">
                      <div class="input-wrapper">
                          <textarea id="userInput" placeholder="Type your message..." rows="1"></textarea>
                          <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                      </div>
                  </div>
              </div>
              
              <script>
                  // Configure marked
                  marked.setOptions({
                      highlight: function(code, lang) {
                          if (lang && hljs.getLanguage(lang)) {
                              return hljs.highlight(code, { language: lang }).value;
                          }
                          return hljs.highlightAuto(code).value;
                      },
                      breaks: true,
                      gfm: true
                  });
                  
                  // Welcome message
                  document.getElementById('welcomeMessage').innerHTML = marked.parse(
                      "Hello! I'm **{{ model_name }}** running locally. How can I help you today?"
                  );
                  
                  // DOM references
                  const chatContainer = document.getElementById('chatContainer');
                  const userInput = document.getElementById('userInput');
                  const sendButton = document.getElementById('sendButton');
                  const tokenCounter = document.getElementById('tokenCounter');
                  
                  let isStreaming = false;
                  let totalTokens = 0;
                  let messageHistory = [];
                  let currentAssistantMessage = null;
                  
                  // Auto-resize textarea
                  userInput.addEventListener('input', function() {
                      this.style.height = 'auto';
                      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
                  });
                  
                  // Enter to send
                  userInput.addEventListener('keydown', function(e) {
                      if (e.key === 'Enter' && !e.shiftKey) {
                          e.preventDefault();
                          sendMessage();
                      }
                  });
                  
                  // Temperature slider
                  document.getElementById('temperature').addEventListener('input', function() {
                      document.getElementById('tempValue').textContent = this.value;
                  });
                  
                  // Max tokens slider
                  document.getElementById('maxTokens').addEventListener('input', function() {
                      document.getElementById('tokenValue').textContent = this.value;
                  });
                  
                  function addMessage(role, content) {
                      const messageDiv = document.createElement('div');
                      messageDiv.className = 'message';
                      
                      const avatar = document.createElement('div');
                      avatar.className = `message-avatar ${role}`;
                      avatar.textContent = role === 'user' ? '👤' : '🦙';
                      
                      const contentDiv = document.createElement('div');
                      contentDiv.className = 'message-content';
                      contentDiv.innerHTML = marked.parse(content);
                      
                      // Highlight code blocks
                      contentDiv.querySelectorAll('pre code').forEach(block => {
                          hljs.highlightElement(block);
                      });
                      
                      messageDiv.appendChild(avatar);
                      messageDiv.appendChild(contentDiv);
                      chatContainer.appendChild(messageDiv);
                      
                      chatContainer.scrollTop = chatContainer.scrollHeight;
                      return contentDiv;
                  }
                  
                  function addTypingIndicator() {
                      const messageDiv = document.createElement('div');
                      messageDiv.className = 'message';
                      messageDiv.id = 'typingIndicator';
                      
                      const avatar = document.createElement('div');
                      avatar.className = 'message-avatar assistant';
                      avatar.textContent = '🦙';
                      
                      const contentDiv = document.createElement('div');
                      contentDiv.className = 'message-content';
                      contentDiv.innerHTML = `
                          <div class="typing-indicator">
                              <span class="typing-dot"></span>
                              <span class="typing-dot"></span>
                              <span class="typing-dot"></span>
                          </div>
                      `;
                      
                      messageDiv.appendChild(avatar);
                      messageDiv.appendChild(contentDiv);
                      chatContainer.appendChild(messageDiv);
                      chatContainer.scrollTop = chatContainer.scrollHeight;
                  }
                  
                  function removeTypingIndicator() {
                      const indicator = document.getElementById('typingIndicator');
                      if (indicator) {
                          indicator.remove();
                      }
                  }
                  
                  function updateAssistantMessage(content) {
                      const messages = chatContainer.querySelectorAll('.message');
                      const lastMessage = messages[messages.length - 1];
                      if (lastMessage) {
                          const contentDiv = lastMessage.querySelector('.message-content');
                          if (contentDiv) {
                              contentDiv.innerHTML = marked.parse(content);
                              contentDiv.querySelectorAll('pre code').forEach(block => {
                                  hljs.highlightElement(block);
                              });
                              chatContainer.scrollTop = chatContainer.scrollHeight;
                          }
                      }
                  }
                  
                  function clearChat() {
                      const messages = chatContainer.querySelectorAll('.message');
                      for (let i = 1; i < messages.length; i++) {
                          messages[i].remove();
                      }
                      messageHistory = [];
                      totalTokens = 0;
                      tokenCounter.textContent = '0';
                  }
                  
                  async function sendMessage() {
                      if (isStreaming) return;
                      
                      const text = userInput.value.trim();
                      if (!text) return;
                      
                      // Add user message
                      addMessage('user', text);
                      messageHistory.push({ role: 'user', content: text });
                      
                      userInput.value = '';
                      userInput.style.height = 'auto';
                      sendButton.disabled = true;
                      isStreaming = true;
                      
                      // Show typing indicator
                      addTypingIndicator();
                      
                      try {
                          const temperature = parseFloat(document.getElementById('temperature').value);
                          const maxTokens = parseInt(document.getElementById('maxTokens').value);
                          
                          const response = await fetch('/api/chat', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({
                                  messages: messageHistory,
                                  temperature: temperature,
                                  max_tokens: maxTokens,
                                  stream: true
                              })
                          });
                          
                          if (!response.ok) {
                              throw new Error(`HTTP ${response.status}`);
                          }
                          
                          // Remove typing indicator
                          removeTypingIndicator();
                          
                          // Add assistant message placeholder
                          const assistantContent = addMessage('assistant', '');
                          let fullContent = '';
                          
                          const reader = response.body.getReader();
                          const decoder = new TextDecoder();
                          let buffer = '';
                          
                          while (true) {
                              const { done, value } = await reader.read();
                              if (done) break;
                              
                              buffer += decoder.decode(value, { stream: true });
                              const lines = buffer.split('\n');
                              buffer = lines.pop() || '';
                              
                              for (const line of lines) {
                                  if (line.startsWith('data: ')) {
                                      const data = line.slice(6).trim();
                                      if (data === '[DONE]') continue;
                                      
                                      try {
                                          const parsed = JSON.parse(data);
                                          if (parsed.content) {
                                              fullContent += parsed.content;
                                              assistantContent.innerHTML = marked.parse(fullContent);
                                              assistantContent.querySelectorAll('pre code').forEach(block => {
                                                  hljs.highlightElement(block);
                                              });
                                              chatContainer.scrollTop = chatContainer.scrollHeight;
                                          }
                                      } catch (e) {
                                          // Ignore parse errors
                                      }
                                  }
                              }
                          }
                          
                          // Final render
                          assistantContent.innerHTML = marked.parse(fullContent);
                          assistantContent.querySelectorAll('pre code').forEach(block => {
                              hljs.highlightElement(block);
                          });
                          
                          messageHistory.push({ role: 'assistant', content: fullContent });
                          totalTokens += Math.ceil(fullContent.length / 4);
                          tokenCounter.textContent = totalTokens;
                          
                      } catch (error) {
                          removeTypingIndicator();
                          addMessage('assistant', `❌ Error: ${error.message}`);
                      }
                      
                      sendButton.disabled = false;
                      isStreaming = false;
                      userInput.focus();
                  }
              </script>
          </body>
          </html>
          '''
          
          # Routes
          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE.replace("{{ model_name }}", MODEL_NAME)
          
          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              try:
                  logger.info(f"Chat request: {len(request.messages)} messages")
                  
                  # Convert messages
                  ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]
                  
                  async def generate() -> AsyncGenerator[str, None]:
                      try:
                          async with httpx.AsyncClient(timeout=httpx.Timeout(120.0)) as client:
                              async with client.stream(
                                  "POST",
                                  f"{OLLAMA_HOST}/api/chat",
                                  json={
                                      "model": MODEL_NAME,
                                      "messages": ollama_messages,
                                      "stream": True,
                                      "options": {
                                          "temperature": request.temperature,
                                          "num_predict": request.max_tokens,
                                          "num_ctx": CONTEXT_SIZE
                                      }
                                  }
                              ) as response:
                                  if response.status_code != 200:
                                      error_text = await response.aread()
                                      yield f"data: {json.dumps({'error': f'Ollama error: {response.status_code}'})}\n\n"
                                      return
                                  
                                  async for chunk in response.aiter_bytes():
                                      try:
                                          text = chunk.decode('utf-8')
                                          for line in text.split('\n'):
                                              if line.strip():
                                                  data = json.loads(line)
                                                  if "message" in data and "content" in data["message"]:
                                                      content = data["message"]["content"]
                                                      yield f"data: {json.dumps({'content': content})}\n\n"
                                      except Exception as e:
                                          logger.warning(f"Chunk parse error: {e}")
                                          continue
                                          
                      except httpx.TimeoutException:
                          yield f"data: {json.dumps({'error': 'Request timeout'})}\n\n"
                      except Exception as e:
                          logger.error(f"Generation error: {e}")
                          yield f"data: {json.dumps({'error': str(e)})}\n\n"
                      
                      yield "data: [DONE]\n\n"
                  
                  return StreamingResponse(
                      generate(),
                      media_type="text/event-stream",
                      headers={
                          "Cache-Control": "no-cache",
                          "Connection": "keep-alive",
                          "X-Accel-Buffering": "no"
                      }
                  )
                  
              except Exception as e:
                  logger.error(f"Chat error: {e}")
                  raise HTTPException(status_code=500, detail=str(e))
          
          if __name__ == "__main__":
              uvicorn.run(
                  app,
                  host="0.0.0.0",
                  port=PORT,
                  log_level="info",
                  access_log=False
              )
          EOF
          
          echo "✅ Server script created!"

      - name: 🔧 Start Web Server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐 Starting Web UI server"
          echo "──────────────────────────────────────────"
          
          export MODEL_NAME="${{ github.event.inputs.model }}"
          export CONTEXT_SIZE="${{ github.event.inputs.context_size }}"
          export PORT="${{ github.event.inputs.port }}"
          
          # Start server
          python app.py &
          SERVER_PID=$!
          
          # Wait for server
          echo "⏳ Waiting for web server..."
          for i in {1..20}; do
            if curl -s http://localhost:${{ github.event.inputs.port }} > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              break
            fi
            sleep 2
          done

      - name: 📦 Install Cloudflared
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦 Installing Cloudflared"
          echo "──────────────────────────────────────────"
          
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: 🌐 Create Tunnel
        id: tunnel
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐 Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          
          PORT="${{ github.event.inputs.port }}"
          
          # Start tunnel
          cloudflared tunnel --url http://127.0.0.1:$PORT --protocol http2 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          # Wait for URL
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          COUNTER=0
          
          while [ -z "$TUNNEL_URL" ] && [ $COUNTER -lt 60 ]; do
            if [ -f tunnel.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            fi
            sleep 2
            COUNTER=$((COUNTER + 2))
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║            🎉  O L L A M A   I S   R E A D Y !  🎉               ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          if [ -n "$TUNNEL_URL" ]; then
            echo "║  🔗  TUNNEL URL:  $TUNNEL_URL"
          else
            echo "║  ⚠️  Check logs above for the tunnel URL"
          fi
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          
          # Keep tunnel running
          wait $TUNNEL_PID

      - name: Display Final URL
        if: always() && env.TUNNEL_URL != ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  🔗  ACCESS YOUR OLLAMA UI:"
          echo "  📌  ${{ env.TUNNEL_URL }}"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          pkill -f cloudflared 2>/dev/null || true
          pkill -f "python app.py" 2>/dev/null || true
          pkill -f ollama 2>/dev/null || true
          echo "✅ Cleanup complete"
