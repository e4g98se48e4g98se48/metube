name: 🦙 Local LLM Web Interface (All Models)

on:
  workflow_dispatch:
    inputs:
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string
      # model input removed – all models are downloaded unconditionally

permissions:
  contents: read

concurrency:
  group: llama-web-ui
  cancel-in-progress: true

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 180          # extra time for downloading many models
    env:
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}

    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║   🦙  L O C A L   L L M   W E B   U I   ( A L L   M O D E L S ) ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  💾 Memory:  $(free -h | awk '/Mem:/{print $2}')"
          echo "  🧠 CPUs:    $(nproc)"
          echo "  💽 Disk before cleanup:"
          df -h / | tail -1

      - name: 🧹 Free up disk space
        run: |
          echo "──────────────────────────────────────────"
          echo " 🧹  Reclaiming disk space"
          echo "──────────────────────────────────────────"
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "  💽 Disk after cleanup:"
          df -h / | tail -1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Ollama + Python packages"
          echo "──────────────────────────────────────────"
          curl -fsSL https://ollama.com/install.sh | sh
          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic
          ollama --version
          python --version

      - name: 🚀 Start Ollama server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama"
          echo "──────────────────────────────────────────"
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid
          echo "⏳ Waiting for Ollama to become ready..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Last logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi

      - name: 📥 Download ALL models
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Downloading ALL models from the list"
          echo "──────────────────────────────────────────"
          echo "⚠️  This will consume a lot of disk space and time."
          echo "    If you run out of space, the job will fail."

          # All models from the original choice list (verified to fit individually)
          MODELS=(
            "qwen2.5:0.5b"
            "qwen3:0.6b"
            "smollm2:360m"
            "tinyllama:1.1b"
            "llama3.2:1b"
            "gemma3:1b"
            "qwen2.5:1.5b"
            "qwen3:1.7b"
            "smollm2:1.7b"
            "stablelm2:1.6b"
            "llama3.2:3b"
            "gemma2:2b"
            "gemma3:4b"
            "qwen2.5:3b"
            "qwen3:4b"
            "phi3:mini"
            "phi4-mini"
            "falcon3:3b"
            "granite3-dense:2b"
            "mistral:7b"
            "llama3.1:8b"
            "llama3:8b"
            "qwen2.5:7b"
            "qwen3:8b"
            "deepseek-r1:7b"
            "deepseek-r1:8b"
            "codellama:7b"
            "starcoder2:7b"
            "gemma2:9b"
            "aya:8b"
            "olmo2:7b"
            "granite3-dense:8b"
            "gemma3:12b"
            "olmo2:13b"
            "qwen2.5:14b"
            "deepseek-r1:14b"
            "phi4:14b"
          )

          total=${#MODELS[@]}
          current=0
          for model in "${MODELS[@]}"; do
            current=$((current + 1))
            echo ""
            echo "──────────────────────────────────────────"
            echo " [$current/$total] Pulling $model"
            echo "──────────────────────────────────────────"
            if ! ollama pull "$model"; then
              echo "❌ Failed to pull $model – continuing anyway"
            fi
            echo "  💽 Disk usage now:"
            df -h / | tail -1
          done

          echo ""
          echo "✅ All pulls attempted. Final model list:"
          ollama list

      - name: 🔧 Write the web server (with model selector)
        run: |
          cat > ollama_server.py << 'PYEOF'
          #!/usr/bin/env python3
          """Ollama-backed chat web server with a model selector UI."""

          import json
          import os
          import logging
          from typing import Optional, List

          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("llama-ui")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          PORT = int(os.getenv("PORT", "7860"))

          app = FastAPI(title="Local LLM UI (All Models)")

          class ChatMessage(BaseModel):
              role: str
              content: str

          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              model: str                    # now required; frontend sends selected model
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048

          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok"}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/api/models")
          async def list_models():
              """Return the list of models available in Ollama."""
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                      data = r.json()
                      models = [m["name"] for m in data.get("models", [])]
                      return {"models": models}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))

          @app.get("/", response_class=HTMLResponse)
          async def root():
              return HTML_TEMPLATE

          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]

              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=180) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": request.model,          # use the selected model
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  body = await response.aread()
                                  yield f"data: {json.dumps({'error': body.decode(errors='ignore')})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return

                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                  except json.JSONDecodeError:
                                      continue
                                  if err := obj.get("error"):
                                      yield f"data: {json.dumps({'error': err})}\n\n"
                                      continue
                                  content = obj.get("message", {}).get("content")
                                  if content:
                                      yield f"data: {json.dumps({'content': content})}\n\n"
                  except Exception as exc:
                      logger.exception("chat stream failed")
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"

              return StreamingResponse(generate(), media_type="text/event-stream")

          # ---------- HTML template with model selector dropdown ----------
          HTML_TEMPLATE = r'''
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Local LLM · all models</title>

          <!-- Markdown (GFM) -->
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link id="hljsTheme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

          <style>
            :root {
              --bg: #fdfbf7; --sidebar: #f4efe6; --border: #e6dfd5;
              --text: #383735; --text-secondary: #73716b; --accent: #cc785c;
              --user-bg: #f4efe6; --assistant-bg: #ffffff; --input-bg: #ffffff;
              --danger: #c0392b; --ok: #3c9a5f; --code-bg: #1e1e1e;
              --shadow: 0 4px 20px rgba(0,0,0,.05);
            }
            html.dark {
              --bg: #262624; --sidebar: #1f1e1c; --border: #3a3936;
              --text: #ece8e1; --text-secondary: #a8a29a; --accent: #e0906b;
              --user-bg: #1f1e1c; --assistant-bg: #2b2a28; --input-bg: #2b2a28;
              --code-bg: #17171590; --shadow: 0 4px 20px rgba(0,0,0,.35);
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
              font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
              transition: background .2s ease, color .2s ease;
            }
            .sidebar {
              width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
              display: flex; flex-direction: column; padding: 16px; flex-shrink: 0; transition: transform .2s ease, background .2s ease;
            }
            .new-chat-btn {
              display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px;
              background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
              font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 12px;
              box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: background .2s, border-color .2s;
            }
            .new-chat-btn:hover { border-color: var(--accent); }
            .theme-toggle {
              display: flex; align-items: center; justify-content: space-between; width: 100%;
              padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg);
              color: var(--text); font-size: 13px; cursor: pointer; margin-bottom: 20px;
            }
            .sidebar-footer {
              margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px;
              font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 8px;
            }
            .model-tag {
              background: rgba(204,120,92,.14); color: var(--accent); padding: 4px 8px;
              border-radius: 6px; font-size: 12px; font-weight: 600; width: fit-content;
            }
            .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
            .status-dot.ok { background: var(--ok); }
            .status-dot.bad { background: var(--danger); }
            .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--bg); }
            .menu-btn { display: none; }
            .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 0 150px 0; scroll-behavior: smooth; }
            .message-row {
              width: 100%; display: flex; justify-content: center; padding: 24px 16px;
              border-bottom: 1px solid rgba(230,223,213,.25); animation: fadeIn .25s ease;
            }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
            .message-row.user { background: var(--user-bg); }
            .message-row.assistant { background: var(--assistant-bg); }
            .message-row.error .message-body { color: var(--danger); }
            .message-inner { max-width: 800px; width: 100%; display: flex; gap: 16px; line-height: 1.7; font-size: 15px; }
            .avatar {
              width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
              font-size: 13px; font-weight: 600; flex-shrink: 0; color: #fff;
            }
            .avatar.user { background: linear-gradient(135deg, #4a4846, #22211f); }
            .avatar.assistant { background: linear-gradient(135deg, var(--accent), #a85f45); }
            .message-body { flex: 1; overflow-x: auto; min-width: 0; }
            .message-body > *:first-child { margin-top: 0; }
            .message-body p { margin: 0 0 12px; }
            .message-body p:last-child { margin-bottom: 0; }
            .message-body h1, .message-body h2, .message-body h3 { margin: 18px 0 8px; line-height: 1.35; }
            .message-body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
            .message-body pre {
              background: var(--code-bg); color: #d4d4d4; padding: 30px 14px 14px; border-radius: 8px;
              overflow-x: auto; margin: 12px 0; border: 1px solid rgba(255,255,255,.08); position: relative;
            }
            .message-body code {
              font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px;
              background: rgba(127,127,127,.15); padding: 2px 5px; border-radius: 4px;
            }
            .message-body pre code { background: transparent; padding: 0; color: inherit; }
            .code-lang {
              position: absolute; top: 8px; left: 12px; font-size: 11px; color: #999;
              text-transform: uppercase; letter-spacing: .04em; font-family: ui-sans-serif, system-ui, sans-serif;
            }
            .copy-btn {
              position: absolute; top: 6px; right: 8px; background: rgba(255,255,255,.08); border: none;
              color: #ccc; font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer;
            }
            .copy-btn:hover { background: rgba(255,255,255,.18); }
            .message-body ul, .message-body ol { padding-left: 22px; margin: 0 0 12px; }
            .message-body li { margin: 3px 0; }
            .message-body ul.contains-task-list { list-style: none; padding-left: 4px; }
            .message-body li.task-list-item { display: flex; align-items: flex-start; gap: 8px; }
            .message-body li.task-list-item input[type="checkbox"] { margin-top: 5px; accent-color: var(--accent); }
            .message-body blockquote {
              border-left: 3px solid var(--accent); padding: 2px 12px; color: var(--text-secondary); margin: 12px 0;
            }
            .message-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
            .message-body th, .message-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
            .message-body th { background: var(--sidebar); }
            .message-body img { max-width: 100%; border-radius: 8px; }
            .message-body a { color: var(--accent); }
            .message-body del { opacity: .6; }
            .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
            .input-area-wrapper {
              position: absolute; bottom: 0; left: 0; width: 100%;
              background: linear-gradient(180deg, transparent 0%, var(--bg) 45%);
              padding: 20px 24px 28px 24px; display: flex; justify-content: center;
            }
            .input-box {
              max-width: 800px; width: 100%; background: var(--input-bg); border: 1px solid var(--border);
              border-radius: 16px; box-shadow: var(--shadow); display: flex; align-items: flex-end;
              padding: 12px 16px; gap: 12px;
            }
            .input-box textarea {
              flex: 1; background: transparent; border: none; color: var(--text); font-family: inherit;
              font-size: 15px; resize: none; outline: none; max-height: 200px; min-height: 24px; line-height: 24px;
            }
            .input-box textarea::placeholder { color: var(--text-secondary); }
            .send-btn, .stop-btn {
              border: none; border-radius: 10px; width: 36px; height: 36px; display: flex; align-items: center;
              justify-content: center; color: #fff; cursor: pointer; transition: opacity .2s, transform .1s; flex-shrink: 0;
            }
            .send-btn { background: var(--accent); }
            .stop-btn { background: var(--danger); display: none; }
            .send-btn:hover, .stop-btn:hover { opacity: .9; }
            .send-btn:active, .stop-btn:active { transform: scale(.95); }
            .send-btn:disabled { opacity: .3; cursor: not-allowed; }
            .loading-dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
            @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
            .settings-group { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
            .settings-group label { display: flex; justify-content: space-between; align-items: center; }
            .settings-group input[type="range"] { width: 130px; accent-color: var(--accent); }
            #modelSelect {
              background: var(--input-bg); color: var(--text); border: 1px solid var(--border);
              border-radius: 6px; padding: 6px 10px; font-size: 13px; width: 100%; margin-bottom: 12px;
            }
            @media (max-width: 720px) {
              .sidebar { position: fixed; z-index: 20; height: 100vh; transform: translateX(-100%); }
              .sidebar.open { transform: translateX(0); }
              .menu-btn {
                display: flex; position: absolute; top: 14px; left: 14px; z-index: 10; width: 34px; height: 34px;
                align-items: center; justify-content: center; background: var(--input-bg); color: var(--text);
                border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
              }
              .message-inner { max-width: 100%; }
            }
          </style>
          </head>
          <body>
            <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
            <div class="sidebar">
              <button class="new-chat-btn" onclick="clearChat()"><span>＋</span> Start New Chat</button>
              <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
                <span id="themeLabel">🌙 Dark mode</span>
              </button>
              <div class="settings-group">
                <label>Model:</label>
                <select id="modelSelect"></select>
                <label>Temperature: <span id="tempVal">0.7</span></label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                <label>Max tokens: <span id="tokenVal">2048</span></label>
                <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
              </div>
              <div class="sidebar-footer">
                <span class="model-tag" id="currentModelTag">📦</span>
                <span id="statusIndicator"><span class="status-dot ok"></span>Checking...</span>
                <span id="tokenCounter">Tokens (approx): 0</span>
              </div>
            </div>

            <div class="main-content">
              <div class="chat-container" id="chatContainer">
                <div class="message-row assistant">
                  <div class="message-inner">
                    <div class="avatar assistant">✦</div>
                    <div class="message-body" id="welcomeMsg"></div>
                  </div>
                </div>
              </div>

              <div class="input-area-wrapper">
                <div class="input-box">
                  <textarea id="userInput" placeholder="Message the model... (Markdown & LaTeX supported)" rows="1"></textarea>
                  <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                  <button class="stop-btn" id="stopButton" onclick="stopGenerating()">■</button>
                </div>
              </div>
            </div>

          <script>
            const STORE_KEY = 'llama-ui-state-v1';

            // ---------- Theme ----------
            function applyTheme(theme) {
              document.documentElement.classList.toggle('dark', theme === 'dark');
              document.getElementById('hljsTheme').href = theme === 'dark'
                ? 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css'
                : 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css';
              document.getElementById('themeLabel').textContent = theme === 'dark' ? '☀️ Light mode' : '🌙 Dark mode';
            }
            function toggleTheme() {
              const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
              applyTheme(next);
              saveState();
            }
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            // ---------- Markdown + math rendering ----------
            marked.setOptions({
              gfm: true,
              breaks: true,
              highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
              }
            });

            function decorateCodeBlocks(body) {
              body.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const codeEl = pre.querySelector('code');
                const langMatch = codeEl && codeEl.className.match(/language-(\w+)/);
                if (langMatch) {
                  const label = document.createElement('span');
                  label.className = 'code-lang';
                  label.textContent = langMatch[1];
                  pre.appendChild(label);
                }
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                  navigator.clipboard.writeText(pre.innerText.replace(/^Copy\s*/, '')).then(() => {
                    btn.textContent = 'Copied!';
                    setTimeout(() => (btn.textContent = 'Copy'), 1200);
                  });
                };
                pre.appendChild(btn);
              });
            }

            function renderInto(el, text, opts = {}) {
              const rawHtml = marked.parse(text);
              el.innerHTML = DOMPurify.sanitize(rawHtml) + (opts.loading ? '<span class="loading-dots"></span>' : '');
              if (window.renderMathInElement) {
                renderMathInElement(el, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '\\[', right: '\\]', display: true },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '$', right: '$', display: false }
                  ],
                  throwOnError: false
                });
              }
              if (!opts.loading) decorateCodeBlocks(el);
            }

            applyTheme(prefersDark ? 'dark' : 'light');

            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const stopButton = document.getElementById('stopButton');
            const tokenCounter = document.getElementById('tokenCounter');
            const statusIndicator = document.getElementById('statusIndicator');
            const temperatureEl = document.getElementById('temperature');
            const maxTokensEl = document.getElementById('maxTokens');
            const modelSelect = document.getElementById('modelSelect');
            const currentModelTag = document.getElementById('currentModelTag');
            let isStreaming = false;
            let totalTokens = 0;
            let messageHistory = [];
            let controller = null;
            let currentModel = null;

            // ---------- Fetch models and populate dropdown ----------
            async function loadModels() {
              try {
                const resp = await fetch('/api/models');
                if (!resp.ok) throw new Error('Failed to fetch models');
                const data = await resp.json();
                const models = data.models || [];
                if (models.length === 0) {
                  modelSelect.innerHTML = '<option value="">No models found</option>';
                  return;
                }
                // Populate dropdown
                modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
                // Select first model by default
                modelSelect.value = models[0];
                currentModel = models[0];
                updateModelTag();
              } catch (e) {
                console.error('Error loading models:', e);
                modelSelect.innerHTML = '<option value="">Error loading models</option>';
              }
            }

            function updateModelTag() {
              if (currentModel) {
                currentModelTag.textContent = '📦 ' + currentModel;
              } else {
                currentModelTag.textContent = '📦 (no model)';
              }
            }

            modelSelect.addEventListener('change', function() {
              currentModel = this.value;
              updateModelTag();
              saveState();
            });

            // ---------- Persistence ----------
            function saveState() {
              try {
                localStorage.setItem(STORE_KEY, JSON.stringify({
                  theme: document.documentElement.classList.contains('dark') ? 'dark' : 'light',
                  temperature: temperatureEl.value,
                  maxTokens: maxTokensEl.value,
                  messageHistory,
                  totalTokens,
                  model: currentModel
                }));
              } catch { /* ignore */ }
            }
            function restoreState() {
              try {
                const raw = localStorage.getItem(STORE_KEY);
                if (!raw) return;
                const s = JSON.parse(raw);
                if (s.theme) applyTheme(s.theme);
                if (s.temperature) { temperatureEl.value = s.temperature; document.getElementById('tempVal').textContent = s.temperature; }
                if (s.maxTokens) { maxTokensEl.value = s.maxTokens; document.getElementById('tokenVal').textContent = s.maxTokens; }
                if (s.model) {
                  // Wait for dropdown to be populated, then set
                  setTimeout(() => {
                    if (modelSelect.querySelector(`option[value="${s.model}"]`)) {
                      modelSelect.value = s.model;
                      currentModel = s.model;
                      updateModelTag();
                    }
                  }, 100);
                }
                if (Array.isArray(s.messageHistory)) {
                  messageHistory = s.messageHistory;
                  totalTokens = s.totalTokens || 0;
                  messageHistory.forEach(m => appendMessage(m.role, m.content));
                  tokenCounter.textContent = `Tokens (approx): ${totalTokens}`;
                }
              } catch { /* ignore */ }
            }

            async function checkHealth() {
              try {
                const r = await fetch('/api/health');
                statusIndicator.innerHTML = r.ok
                  ? '<span class="status-dot ok"></span>Ollama ready'
                  : '<span class="status-dot bad"></span>Ollama unreachable';
              } catch {
                statusIndicator.innerHTML = '<span class="status-dot bad"></span>Ollama unreachable';
              }
            }
            checkHealth();
            setInterval(checkHealth, 15000);

            userInput.addEventListener('input', function () {
              this.style.height = 'auto';
              this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
            userInput.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
            temperatureEl.addEventListener('input', function () {
              document.getElementById('tempVal').textContent = this.value; saveState();
            });
            maxTokensEl.addEventListener('input', function () {
              document.getElementById('tokenVal').textContent = this.value; saveState();
            });

            function appendMessage(role, content, isLoading = false, isError = false) {
              const row = document.createElement('div');
              row.className = `message-row ${role}` + (isError ? ' error' : '');
              const inner = document.createElement('div');
              inner.className = 'message-inner';
              const avatar = document.createElement('div');
              avatar.className = `avatar ${role}`;
              avatar.textContent = role === 'user' ? 'You' : '✦';
              const body = document.createElement('div');
              body.className = 'message-body';
              inner.appendChild(avatar);
              inner.appendChild(body);
              row.appendChild(inner);
              chatContainer.appendChild(row);
              renderInto(body, content, { loading: isLoading });
              chatContainer.scrollTop = chatContainer.scrollHeight;
              return body;
            }

            function updateLastAssistantMessage(content, isComplete = false) {
              const rows = chatContainer.querySelectorAll('.message-row.assistant');
              if (!rows.length) return;
              const body = rows[rows.length - 1].querySelector('.message-body');
              if (!body) return;
              renderInto(body, content, { loading: !isComplete });
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function clearChat() {
              const rows = chatContainer.querySelectorAll('.message-row');
              for (let i = 1; i < rows.length; i++) rows[i].remove();
              messageHistory = [];
              totalTokens = 0;
              tokenCounter.textContent = 'Tokens (approx): 0';
              saveState();
            }

            function stopGenerating() {
              if (controller) controller.abort();
            }

            async function sendMessage() {
              if (isStreaming) return;
              const text = userInput.value.trim();
              if (!text) return;
              if (!currentModel) {
                alert('Please select a model first.');
                return;
              }

              appendMessage('user', text);
              messageHistory.push({ role: 'user', content: text });
              userInput.value = '';
              userInput.style.height = 'auto';

              sendButton.style.display = 'none';
              stopButton.style.display = 'flex';
              isStreaming = true;
              controller = new AbortController();

              appendMessage('assistant', 'Thinking', true);

              let fullContent = '';
              try {
                const temperature = parseFloat(temperatureEl.value);
                const maxTokens = parseInt(maxTokensEl.value);

                const response = await fetch('/api/chat', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  signal: controller.signal,
                  body: JSON.stringify({
                    messages: messageHistory,
                    model: currentModel,
                    temperature,
                    max_tokens: maxTokens
                  })
                });
                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let streamError = null;

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.error) { streamError = parsed.error; }
                      else if (parsed.content) {
                        fullContent += parsed.content;
                        updateLastAssistantMessage(fullContent, false);
                      }
                    } catch { /* ignore */ }
                  }
                }

                if (streamError) throw new Error(streamError);

                updateLastAssistantMessage(fullContent, true);
                messageHistory.push({ role: 'assistant', content: fullContent });
                totalTokens += Math.ceil(fullContent.length / 4);
                tokenCounter.textContent = `Tokens (approx): ${totalTokens}`;
                saveState();
              } catch (error) {
                if (error.name === 'AbortError') {
                  updateLastAssistantMessage(fullContent + '\n\n*(stopped)*', true);
                  if (fullContent) { messageHistory.push({ role: 'assistant', content: fullContent }); saveState(); }
                } else {
                  updateLastAssistantMessage(`⚠️ ${error.message || 'Error generating a response.'}`, true);
                }
              }

              sendButton.style.display = 'flex';
              stopButton.style.display = 'none';
              isStreaming = false;
              controller = null;
              userInput.focus();
            }

            // Load models and restore state
            loadModels().then(() => {
              restoreState();
              // If no model restored, pick first
              if (!currentModel && modelSelect.options.length > 0) {
                currentModel = modelSelect.value;
                updateModelTag();
              }
              // Set welcome message with current model
              const welcome = document.getElementById('welcomeMsg');
              const modelName = currentModel || 'model';
              renderInto(welcome, `Hello! I'm **${modelName}** running locally on this runner. Ask me anything — tables, code, task lists, and math (\`$e=mc^2$\`) all render here.`);
            });

          </script>
          </body>
          </html>
          '''
          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Server script written"

      - name: 🌐 Start web server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting web UI"
          echo "──────────────────────────────────────────"
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid
          ready=false
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "❌ Web UI failed to start. Last logs:"
            tail -n 50 /tmp/webui.log || true
            exit 1
          fi

      - name: 📦 Install cloudflared
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: 🌐 Create tunnel and wait
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get a tunnel URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║              🎉  Y O U R   L L M   I S   R E A D Y  🎉             ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          {
            echo "## 🦙 Your LLM web UI is live"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**All models downloaded** – use the dropdown in the sidebar to switch."
            echo "**Context:** ${CONTEXT_SIZE} tokens"
            echo ""
            echo "> This link stays live for as long as this job keeps running (up to the timeout, or until you cancel the run)."
          } >> "$GITHUB_STEP_SUMMARY"
          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
