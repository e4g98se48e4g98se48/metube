name: 🦙 Local LLM Web Interface

# ────────────────────────────────────────────────────────────────────────
# WHAT THIS DOES
#   Spins up an Ollama model + a Claude-styled chat UI on a GitHub-hosted
#   runner, and exposes it to you over a temporary Cloudflare Tunnel.
#
# HARD LIMITS OF A STANDARD GITHUB RUNNER (read before picking a model)
#   • ~14 GB free disk, ~16 GB RAM, 4 vCPU, CPU-only (no GPU)
#   • That rules out anything above ~14B parameters at 4-bit quantization.
#   The original version of this workflow listed 70B/104B/671B/MoE models
#   that simply cannot fit — `ollama pull` would fill the disk and die,
#   or the process would be OOM-killed. This version only lists models
#   that reliably fit, and adds a disk-cleanup step for extra headroom.
#
#   If your org has access to GitHub's larger runners (more RAM/disk),
#   change `runs-on` below and you can put bigger models back in the list.
# ────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      model:
        description: '📦 Model to run (all fit on a standard runner)'
        required: false
        default: 'qwen2.5:1.5b'
        type: choice
        options:
          - 'qwen2.5:0.5b'      # ~0.4GB  - fastest, weakest
          - 'qwen2.5:1.5b'      # ~1.0GB  - good default
          - 'llama3.2:1b'       # ~1.3GB
          - 'tinyllama:1.1b'    # ~0.6GB
          - 'gemma:2b'          # ~1.7GB
          - 'stablelm2:1.6b'    # ~1.0GB
          - 'llama3.2:3b'       # ~2.0GB
          - 'phi3:mini'         # ~2.2GB  - 3.8B, strong for its size
          - 'gemma2:2b'         # ~1.6GB
          - 'mistral:7b'        # ~4.1GB
          - 'llama3.1:8b'       # ~4.7GB
          - 'qwen2.5:7b'        # ~4.4GB
          - 'llama3:8b'         # ~4.7GB
          - 'codellama:7b'      # ~3.8GB  - code-focused
          - 'deepseek-r1:7b'    # ~4.7GB  - reasoning model
          - 'gemma2:9b'         # ~5.4GB
          - 'aya:8b'            # ~4.8GB  - multilingual
          - 'qwen2.5:14b'       # ~9.0GB  - largest that reliably fits
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context window (tokens)'
        required: false
        default: '4096'
        type: string

permissions:
  contents: read

concurrency:
  group: llama-web-ui
  cancel-in-progress: true

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODEL_NAME: ${{ inputs.model }}
      CONTEXT_SIZE: ${{ inputs.context_size }}
      PORT: ${{ inputs.port }}

    steps:
      - name: 🦙 Show banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║            🦙  L O C A L   L L M   W E B   U I                    ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo "  📦 Model:   ${MODEL_NAME}"
          echo "  📝 Context: ${CONTEXT_SIZE} tokens"
          echo "  🔌 Port:    ${PORT}"
          echo "  🏃 Runner:  $(uname -a)"
          echo "  💾 Memory:  $(free -h | awk '/Mem:/{print $2}')"
          echo "  🧠 CPUs:    $(nproc)"
          echo "  💽 Disk before cleanup:"
          df -h / | tail -1

      - name: 🧹 Free up disk space
        # Standard runners ship with ~30-40GB of preinstalled toolchains we
        # don't need (Android SDK, .NET, GHC, extra docker images, etc).
        # Removing them buys real headroom for the model download.
        run: |
          echo "──────────────────────────────────────────"
          echo " 🧹  Reclaiming disk space"
          echo "──────────────────────────────────────────"
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "  💽 Disk after cleanup:"
          df -h / | tail -1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Ollama + Python packages"
          echo "──────────────────────────────────────────"
          curl -fsSL https://ollama.com/install.sh | sh
          pip install --no-cache-dir \
            fastapi uvicorn aiohttp httpx python-multipart \
            jinja2 websockets pydantic
          ollama --version
          python --version
          echo "✅ Dependencies installed"

      - name: 🚀 Start Ollama server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama"
          echo "──────────────────────────────────────────"

          # The install script auto-registers/starts an "ollama" systemd
          # service on Linux. Stop it first so we have a single, known
          # server process instead of two fighting over the same port.
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true

          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo $! > /tmp/ollama.pid

          echo "⏳ Waiting for Ollama to become ready..."
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "❌ Ollama failed to start. Last logs:"
            tail -n 50 /tmp/ollama.log || true
            exit 1
          fi

      - name: 📥 Download model
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Downloading model: ${MODEL_NAME}"
          echo "──────────────────────────────────────────"
          echo "⏳ This can take a few minutes depending on model size..."

          if ! ollama pull "$MODEL_NAME"; then
            echo "❌ Model pull failed (often disk space or network). Disk state:"
            df -h /
            exit 1
          fi

          if ! ollama list | grep -q "$(echo "$MODEL_NAME" | cut -d: -f1)"; then
            echo "❌ Model does not appear in 'ollama list' after pull."
            ollama list
            exit 1
          fi

          echo "✅ Model ready:"
          ollama list

      - name: 🔧 Write the web server
        run: |
          cat > ollama_server.py << 'PYEOF'
          #!/usr/bin/env python3
          """Ollama-backed chat web server with a Claude-styled UI."""

          import json
          import os
          import logging
          from typing import Optional, List

          import httpx
          import uvicorn
          from fastapi import FastAPI, HTTPException
          from fastapi.responses import HTMLResponse, StreamingResponse
          from pydantic import BaseModel

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("llama-ui")

          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          MODEL_NAME = os.getenv("MODEL_NAME", "qwen2.5:1.5b")
          PORT = int(os.getenv("PORT", "7860"))

          app = FastAPI(title="Local LLM UI")


          class ChatMessage(BaseModel):
              role: str
              content: str


          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048


          @app.get("/api/health")
          async def health():
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      r = await client.get(f"{OLLAMA_HOST}/api/tags")
                      r.raise_for_status()
                  return {"status": "ok", "model": MODEL_NAME}
              except Exception as exc:
                  raise HTTPException(status_code=503, detail=str(exc))


          @app.get("/", response_class=HTMLResponse)
          async def root():
              return (
                  HTML_TEMPLATE
                  .replace("__MODEL_NAME__", MODEL_NAME)
                  .replace("__CONTEXT_SIZE__", str(CONTEXT_SIZE))
              )


          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]

              async def generate():
                  try:
                      async with httpx.AsyncClient(timeout=180) as client:
                          async with client.stream(
                              "POST",
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": MODEL_NAME,
                                  "messages": ollama_messages,
                                  "stream": True,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE,
                                  },
                              },
                          ) as response:
                              if response.status_code != 200:
                                  body = await response.aread()
                                  yield f"data: {json.dumps({'error': body.decode(errors='ignore')})}\n\n"
                                  yield "data: [DONE]\n\n"
                                  return

                              async for line in response.aiter_lines():
                                  line = line.strip()
                                  if not line:
                                      continue
                                  try:
                                      obj = json.loads(line)
                                  except json.JSONDecodeError:
                                      continue
                                  if err := obj.get("error"):
                                      yield f"data: {json.dumps({'error': err})}\n\n"
                                      continue
                                  content = obj.get("message", {}).get("content")
                                  if content:
                                      yield f"data: {json.dumps({'content': content})}\n\n"
                  except Exception as exc:
                      logger.exception("chat stream failed")
                      yield f"data: {json.dumps({'error': str(exc)})}\n\n"
                  yield "data: [DONE]\n\n"

              return StreamingResponse(generate(), media_type="text/event-stream")


          HTML_TEMPLATE = r'''
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Local LLM · __MODEL_NAME__</title>
          <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
          <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
          <style>
            :root {
              --bg: #fdfbf7; --sidebar: #f4efe6; --border: #e6dfd5;
              --text: #383735; --text-secondary: #73716b; --accent: #cc785c;
              --user-bg: #f4efe6; --assistant-bg: #ffffff; --input-bg: #ffffff;
              --danger: #c0392b; --ok: #3c9a5f;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
              font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            }
            .sidebar {
              width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
              display: flex; flex-direction: column; padding: 16px; flex-shrink: 0; transition: transform .2s ease;
            }
            .new-chat-btn {
              display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px;
              background: #fff; border: 1px solid var(--border); border-radius: 8px; color: var(--text);
              font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 20px;
              box-shadow: 0 1px 2px rgba(0,0,0,.03); transition: background .2s, border-color .2s;
            }
            .new-chat-btn:hover { background: #faf8f5; border-color: #d1c7bc; }
            .sidebar-footer {
              margin-top: auto; border-top: 1px solid var(--border); padding-top: 14px;
              font-size: 13px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 8px;
            }
            .model-tag {
              background: rgba(204,120,92,.12); color: var(--accent); padding: 4px 8px;
              border-radius: 6px; font-size: 12px; font-weight: 600; width: fit-content;
            }
            .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
            .status-dot.ok { background: var(--ok); }
            .status-dot.bad { background: var(--danger); }
            .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; background: var(--bg); }
            .menu-btn { display: none; }
            .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; padding: 20px 0 150px 0; scroll-behavior: smooth; }
            .message-row { width: 100%; display: flex; justify-content: center; padding: 24px 16px; border-bottom: 1px solid rgba(230,223,213,.4); }
            .message-row.user { background: var(--user-bg); }
            .message-row.assistant { background: var(--assistant-bg); }
            .message-row.error .message-body { color: var(--danger); }
            .message-inner { max-width: 768px; width: 100%; display: flex; gap: 16px; line-height: 1.7; font-size: 15px; }
            .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
            .avatar.user { background: #383735; color: #fff; }
            .avatar.assistant { background: var(--accent); color: #fff; }
            .message-body { flex: 1; overflow-x: auto; }
            .message-body p { margin-bottom: 12px; }
            .message-body p:last-child { margin-bottom: 0; }
            .message-body pre { background: #1e1e1e; color: #d4d4d4; padding: 14px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid #333; position: relative; }
            .message-body code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; background: rgba(0,0,0,.06); padding: 2px 5px; border-radius: 4px; }
            .message-body pre code { background: transparent; padding: 0; color: inherit; }
            .copy-btn {
              position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,.1); border: none;
              color: #ccc; font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer;
            }
            .copy-btn:hover { background: rgba(255,255,255,.2); }
            .message-body ul, .message-body ol { padding-left: 22px; margin-bottom: 12px; }
            .message-body blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 12px 0; }
            .message-body table { width: 100%; border-collapse: collapse; margin: 12px 0; }
            .message-body th, .message-body td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
            .message-body th { background: var(--sidebar); }
            .input-area-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(180deg, rgba(253,251,247,0) 0%, var(--bg) 40%); padding: 20px 24px 28px 24px; display: flex; justify-content: center; }
            .input-box { max-width: 768px; width: 100%; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.05); display: flex; align-items: flex-end; padding: 12px 16px; gap: 12px; }
            .input-box textarea { flex: 1; background: transparent; border: none; color: var(--text); font-family: inherit; font-size: 15px; resize: none; outline: none; max-height: 200px; min-height: 24px; line-height: 24px; }
            .input-box textarea::placeholder { color: #a8a29e; }
            .send-btn, .stop-btn { border: none; border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; transition: opacity .2s, transform .1s; flex-shrink: 0; }
            .send-btn { background: var(--accent); }
            .stop-btn { background: var(--danger); display: none; }
            .send-btn:hover, .stop-btn:hover { opacity: .9; }
            .send-btn:active, .stop-btn:active { transform: scale(.95); }
            .send-btn:disabled { opacity: .3; cursor: not-allowed; }
            .loading-dots::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
            @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
            .settings-group { display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
            .settings-group label { display: flex; justify-content: space-between; align-items: center; }
            .settings-group input[type="range"] { width: 130px; accent-color: var(--accent); }

            @media (max-width: 720px) {
              .sidebar { position: fixed; z-index: 20; height: 100vh; transform: translateX(-100%); }
              .sidebar.open { transform: translateX(0); }
              .menu-btn {
                display: flex; position: absolute; top: 14px; left: 14px; z-index: 10; width: 34px; height: 34px;
                align-items: center; justify-content: center; background: #fff; border: 1px solid var(--border);
                border-radius: 8px; cursor: pointer;
              }
              .message-inner { max-width: 100%; }
            }
          </style>
          </head>
          <body>
            <button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
            <div class="sidebar">
              <button class="new-chat-btn" onclick="clearChat()"><span>＋</span> Start New Chat</button>
              <div class="settings-group">
                <label>Temperature: <span id="tempVal">0.7</span></label>
                <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                <label>Max tokens: <span id="tokenVal">2048</span></label>
                <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
              </div>
              <div class="sidebar-footer">
                <span class="model-tag">📦 __MODEL_NAME__</span>
                <span id="statusIndicator"><span class="status-dot ok"></span>Checking...</span>
                <span id="tokenCounter">Tokens (approx): 0</span>
              </div>
            </div>

            <div class="main-content">
              <div class="chat-container" id="chatContainer">
                <div class="message-row assistant">
                  <div class="message-inner">
                    <div class="avatar assistant">✨</div>
                    <div class="message-body" id="welcomeMsg"></div>
                  </div>
                </div>
              </div>

              <div class="input-area-wrapper">
                <div class="input-box">
                  <textarea id="userInput" placeholder="Message the model..." rows="1"></textarea>
                  <button class="send-btn" id="sendButton" onclick="sendMessage()">↑</button>
                  <button class="stop-btn" id="stopButton" onclick="stopGenerating()">■</button>
                </div>
              </div>
            </div>

          <script>
            marked.setOptions({
              highlight: function (code, lang) {
                if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
                return hljs.highlightAuto(code).value;
              },
              breaks: true
            });

            function renderMarkdown(text) {
              // marked output is sanitized before hitting innerHTML, since it
              // is rendering model-generated text we don't fully control.
              return DOMPurify.sanitize(marked.parse(text));
            }

            document.getElementById('welcomeMsg').innerHTML =
              renderMarkdown("Hello! I'm **__MODEL_NAME__** running locally on this runner. How can I help?");

            const chatContainer = document.getElementById('chatContainer');
            const userInput = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');
            const stopButton = document.getElementById('stopButton');
            const tokenCounter = document.getElementById('tokenCounter');
            const statusIndicator = document.getElementById('statusIndicator');
            let isStreaming = false;
            let totalTokens = 0;
            let messageHistory = [];
            let controller = null;

            async function checkHealth() {
              try {
                const r = await fetch('/api/health');
                if (r.ok) {
                  statusIndicator.innerHTML = '<span class="status-dot ok"></span>Ollama ready';
                } else {
                  statusIndicator.innerHTML = '<span class="status-dot bad"></span>Ollama unreachable';
                }
              } catch {
                statusIndicator.innerHTML = '<span class="status-dot bad"></span>Ollama unreachable';
              }
            }
            checkHealth();
            setInterval(checkHealth, 15000);

            userInput.addEventListener('input', function () {
              this.style.height = 'auto';
              this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
            userInput.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });
            document.getElementById('temperature').addEventListener('input', function () {
              document.getElementById('tempVal').textContent = this.value;
            });
            document.getElementById('maxTokens').addEventListener('input', function () {
              document.getElementById('tokenVal').textContent = this.value;
            });

            function addCopyButtons(body) {
              body.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                btn.onclick = () => {
                  navigator.clipboard.writeText(pre.innerText).then(() => {
                    btn.textContent = 'Copied!';
                    setTimeout(() => (btn.textContent = 'Copy'), 1200);
                  });
                };
                pre.appendChild(btn);
              });
            }

            function appendMessage(role, content, isLoading = false, isError = false) {
              const row = document.createElement('div');
              row.className = `message-row ${role}` + (isError ? ' error' : '');
              const inner = document.createElement('div');
              inner.className = 'message-inner';
              const avatar = document.createElement('div');
              avatar.className = `avatar ${role}`;
              avatar.textContent = role === 'user' ? 'You' : '✨';
              const body = document.createElement('div');
              body.className = 'message-body';
              body.innerHTML = renderMarkdown(content) + (isLoading ? '<span class="loading-dots"></span>' : '');
              inner.appendChild(avatar);
              inner.appendChild(body);
              row.appendChild(inner);
              chatContainer.appendChild(row);
              chatContainer.scrollTop = chatContainer.scrollHeight;
              return body;
            }

            function updateLastAssistantMessage(content, isComplete = false) {
              const rows = chatContainer.querySelectorAll('.message-row.assistant');
              if (!rows.length) return;
              const body = rows[rows.length - 1].querySelector('.message-body');
              if (!body) return;
              body.innerHTML = renderMarkdown(content) + (isComplete ? '' : '<span class="loading-dots"></span>');
              if (isComplete) addCopyButtons(body);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            function clearChat() {
              const rows = chatContainer.querySelectorAll('.message-row');
              for (let i = 1; i < rows.length; i++) rows[i].remove();
              messageHistory = [];
              totalTokens = 0;
              tokenCounter.textContent = 'Tokens (approx): 0';
            }

            function stopGenerating() {
              if (controller) controller.abort();
            }

            async function sendMessage() {
              if (isStreaming) return;
              const text = userInput.value.trim();
              if (!text) return;

              appendMessage('user', text);
              messageHistory.push({ role: 'user', content: text });
              userInput.value = '';
              userInput.style.height = 'auto';

              sendButton.style.display = 'none';
              stopButton.style.display = 'flex';
              isStreaming = true;
              controller = new AbortController();

              appendMessage('assistant', 'Thinking', true);

              let fullContent = '';
              try {
                const temperature = parseFloat(document.getElementById('temperature').value);
                const maxTokens = parseInt(document.getElementById('maxTokens').value);

                const response = await fetch('/api/chat', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  signal: controller.signal,
                  body: JSON.stringify({ messages: messageHistory, temperature, max_tokens: maxTokens })
                });
                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let streamError = null;

                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  buffer += decoder.decode(value, { stream: true });
                  const lines = buffer.split('\n');
                  buffer = lines.pop() || '';
                  for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                      const parsed = JSON.parse(data);
                      if (parsed.error) { streamError = parsed.error; }
                      else if (parsed.content) {
                        fullContent += parsed.content;
                        updateLastAssistantMessage(fullContent, false);
                      }
                    } catch { /* ignore partial JSON */ }
                  }
                }

                if (streamError) throw new Error(streamError);

                updateLastAssistantMessage(fullContent, true);
                messageHistory.push({ role: 'assistant', content: fullContent });
                totalTokens += Math.ceil(fullContent.length / 4);
                tokenCounter.textContent = `Tokens (approx): ${totalTokens}`;
              } catch (error) {
                if (error.name === 'AbortError') {
                  updateLastAssistantMessage(fullContent + '\n\n_(stopped)_', true);
                  if (fullContent) messageHistory.push({ role: 'assistant', content: fullContent });
                } else {
                  updateLastAssistantMessage(`⚠️ ${error.message || 'Error generating a response.'}`, true);
                }
              }

              sendButton.style.display = 'flex';
              stopButton.style.display = 'none';
              isStreaming = false;
              controller = null;
              userInput.focus();
            }
          </script>
          </body>
          </html>
          '''

          if __name__ == "__main__":
              uvicorn.run(app, host="0.0.0.0", port=PORT, log_level="info")
          PYEOF
          echo "✅ Server script written"

      - name: 🌐 Start web server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting web UI"
          echo "──────────────────────────────────────────"
          nohup python ollama_server.py > /tmp/webui.log 2>&1 &
          echo $! > /tmp/webui.pid

          ready=false
          for i in $(seq 1 15); do
            if curl -sf "http://localhost:${PORT}" > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != "true" ]; then
            echo "❌ Web UI failed to start. Last logs:"
            tail -n 50 /tmp/webui.log || true
            exit 1
          fi

      - name: 📦 Install cloudflared
        run: |
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: 🌐 Create tunnel and wait
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"

          cloudflared tunnel --url "http://127.0.0.1:${PORT}" --protocol http2 > tunnel.log 2>&1 &
          TUNNEL_PID=$!

          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          for i in $(seq 1 30); do
            TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Could not get a tunnel URL. Tunnel log:"
            cat tunnel.log
            exit 1
          fi

          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║              🎉  Y O U R   L L M   I S   R E A D Y  🎉             ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🔗  $TUNNEL_URL"
          echo "╚═══════════════════════════════════════════════════════════════════╝"

          {
            echo "## 🦙 Your LLM web UI is live"
            echo ""
            echo "**URL:** $TUNNEL_URL"
            echo ""
            echo "**Model:** \`${MODEL_NAME}\`  |  **Context:** ${CONTEXT_SIZE} tokens"
            echo ""
            echo "> This link stays live for as long as this job keeps running (up to the 120-minute timeout, or until you cancel the run)."
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep the job (and tunnel) alive until it's cancelled or times out.
          wait "$TUNNEL_PID"

      - name: 🧹 Cleanup
        if: always()
        run: |
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          pkill -f "ollama serve" 2>/dev/null || true
          echo "✅ Cleanup complete"
