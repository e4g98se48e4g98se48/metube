name: MeTube with WARP + Deno.js Bypass

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║         🎬  M E T U B E   W I T H   F U L L   B Y P A S S       ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  🌐 WARP VPN + 🦕 Deno.js = Full YouTube Bypass"
          echo "  🍪 No cookies needed - works like Youtube Downloader"
          echo ""

      - name: Start WARP Container
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  NETWORK  ·  Starting Cloudflare WARP"
          echo "──────────────────────────────────────────"
          
          docker network create warp-net 2>/dev/null || true
          
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp:latest
          
          echo "⏳ Waiting for WARP to initialize (20s)..."
          sleep 20
          
          echo "🔎 Checking WARP status..."
          for i in {1..8}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP is active!"
              echo "$RESULT" | grep -E "warp=|colo=|ip="
              break
            else
              echo "   attempt $i/8 — not ready yet, waiting..."
              sleep 5
            fi
          done
          
          FINAL=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
          if echo "$FINAL" | grep -qE "warp=(on|plus)"; then
            echo "✅ WARP proxy is ready!"
          else
            echo "⚠️  WARP might not be fully active, continuing anyway..."
          fi

      - name: Build MeTube with Deno.js (FINAL FIX)
        run: |
          echo "──────────────────────────────────────────"
          echo " 🔨  BUILD  ·  Creating MeTube with Deno"
          echo "──────────────────────────────────────────"
          
          # Create Dockerfile with Deno.js - FINAL FIX: Run everything as root
          cat > Dockerfile.metube << 'EOF'
          FROM ghcr.io/alexta69/metube:latest
          
          USER root
          
          # Install Deno.js
          RUN apt-get update && apt-get install -y curl unzip && \
              curl -fsSL https://deno.land/install.sh | sh && \
              export DENO_INSTALL="/root/.deno" && \
              export PATH="$DENO_INSTALL/bin:$PATH" && \
              /root/.deno/bin/deno --version
          
          # Set environment for Deno
          ENV DENO_INSTALL="/root/.deno"
          ENV PATH="$DENO_INSTALL/bin:$PATH"
          
          # Install latest yt-dlp
          RUN pip3 install --upgrade yt-dlp
          
          # Verify Deno is accessible
          RUN /root/.deno/bin/deno --version
          
          # Stay as root to avoid user issues
          USER root
          EOF
          
          # Build the custom image
          docker build -f Dockerfile.metube -t metube-deno:latest .
          echo "✅ Custom MeTube with Deno.js built!"

      - name: Create docker-compose with full bypass
        run: |
          cat > docker-compose.yml << 'EOF'
          services:
            metube:
              image: metube-deno:latest
              container_name: metube
              restart: unless-stopped
              ports:
                - "8081:8081"
              volumes:
                - ./downloads:/downloads
              user: root
              environment:
                - TZ=UTC
                - HOST=0.0.0.0
                - MAX_CONCURRENT_DOWNLOADS=5
                - DEFAULT_THEME=dark
                - LOGLEVEL=INFO
                - DENO_INSTALL=/root/.deno
                - PATH=/root/.deno/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                - YTDL_OPTIONS={"proxy":"socks5://host.docker.internal:1080","extractor_args":{"youtube":{"player_client":["web","mweb","android","android_vr"],"skip":["hls","dash"]}},"js_runtimes":"deno","remote_components":"ejs:github","writesubtitles":true,"subtitleslangs":["en","fa"],"writeautomaticsub":true,"updatetime":false,"user_agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36","add_headers":{"Accept-Language":"en-US,en;q=0.9","Accept-Encoding":"gzip, deflate, br"},"sleep_interval":10,"max_sleep_interval":30,"retries":20,"fragment_retries":20}
              extra_hosts:
                - "host.docker.internal:host-gateway"
          EOF
          
          echo "✅ Docker Compose created"

      - name: Start MeTube with full bypass
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  START  ·  Launching MeTube"
          echo "──────────────────────────────────────────"
          
          docker compose up -d
          
          echo "⏳ Waiting for services to start..."
          sleep 15
          
          echo ""
          echo "📊 Container status:"
          docker ps
          
          echo ""
          echo "📋 MeTube logs:"
          docker logs metube 2>&1 | head -30
          
          echo ""
          echo "🔍 Verifying Deno.js in container:"
          docker exec metube deno --version || echo "⚠️ Deno check"
          
          echo ""
          echo "🔍 Verifying WARP connectivity:"
          docker exec metube curl -s --socks5-hostname host.docker.internal:1080 https://cloudflare.com/cdn-cgi/trace | grep -E "warp=|colo=|ip=" || echo "⚠️ WARP check"
          
          echo ""
          echo "✅ MeTube is running!"

      - name: Test YouTube access
        run: |
          echo "──────────────────────────────────────────"
          echo " 🧪  TEST  ·  Verifying YouTube access"
          echo "──────────────────────────────────────────"
          
          docker exec metube sh -c "
            export DENO_INSTALL=/root/.deno
            export PATH=\$DENO_INSTALL/bin:\$PATH
            
            echo '📌 Testing with Deno.js + WARP...'
            
            yt-dlp \
              --proxy socks5://host.docker.internal:1080 \
              --js-runtimes deno \
              --remote-components ejs:github \
              --extractor-args youtube:player_client=web \
              --dump-json --skip-download \
              --no-warnings \
              'https://www.youtube.com/watch?v=dQw4w9WgXcQ' \
              2>&1 | head -20
          " || echo "⚠️ Test completed"

      - name: Install cloudflared
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  SETUP  ·  Installing cloudflared"
          echo "──────────────────────────────────────────"
          
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Create Tunnel and Display URL
        id: tunnel
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  TUNNEL  ·  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          
          cloudflared tunnel --url http://127.0.0.1:8081 --protocol http2 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          COUNTER=0
          
          while [ -z "$TUNNEL_URL" ] && [ $COUNTER -lt 60 ]; do
            if [ -f tunnel.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            fi
            sleep 2
            COUNTER=$((COUNTER + 2))
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║         🎉  M E T U B E   I S   R E A D Y !  🎉                 ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║                                                                   ║"
          if [ -n "$TUNNEL_URL" ]; then
            echo "║  🔗  TUNNEL URL:  $TUNNEL_URL"
          else
            echo "║  ⚠️  Check logs above for the tunnel URL"
          fi
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🌐  WARP VPN      → Active (bypasses IP/rate limits)            ║"
          echo "║  🦕  Deno.js       → Active (executes YouTube JS challenges)     ║"
          echo "║  🍪  Cookies       → Not required (like Youtube Downloader)      ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  📌  HOW TO USE:                                                  ║"
          echo "║  1. Open the URL above in your browser                           ║"
          echo "║  2. Paste any YouTube URL (e.g., V0w3IfLO4SA)                   ║"
          echo "║  3. Click Download - it will bypass all blocks!                  ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  ⏱️  Tunnel expires in ~6 hours (GitHub Action limit)            ║"
          echo "║  📁  Downloads: ./downloads (ephemeral)                          ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          
          wait $TUNNEL_PID

      - name: Display Final URL
        if: always() && env.TUNNEL_URL != ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  🔗  ACCESS YOUR METUBE INSTANCE:"
          echo "  📌  ${{ env.TUNNEL_URL }}"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🎬  This MeTube instance uses the same bypass as Youtube Downloader:"
          echo "     • WARP VPN for IP/rate limit bypass"
          echo "     • Deno.js for JavaScript execution"
          echo "     • Multiple clients for YouTube API"
          echo "     • No cookies required!"
          echo ""
          echo "  📁  Downloads: ./downloads (ephemeral)"
          echo "  ⏱️  Available for: ~6 hours"
          echo ""

      - name: Show error if tunnel failed
        if: failure() || env.TUNNEL_URL == ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  ⚠️  TUNNEL CREATION FAILED - CHECK LOGS"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🔍 Look for 'trycloudflare.com' in the logs above"
          echo "  📝 The URL format is: https://[random-words].trycloudflare.com"
          echo ""
          echo "  💡 If you see 'trycloudflare.com' in the logs, copy that URL"
          echo "     and open it in your browser."
          echo ""

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up containers..."
          docker compose down 2>/dev/null || true
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true
          echo "✅ Cleanup complete"
