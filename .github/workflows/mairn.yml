name: 🦙 Llama 1B Web Interface

on:
  workflow_dispatch:
    inputs:
      model:
        description: '📦 Model to download from Ollama'
        required: false
        default: 'llama3.2:1b'
        type: choice
        options:
          - 'llama3.2:1b'
          - 'llama3.2:3b'
          - 'llama3.1:8b'
          - 'phi3:mini'
          - 'mistral:7b'
          - 'gemma:2b'
          - 'tinyllama:1.1b'
          - 'qwen2.5:0.5b'
          - 'qwen2.5:1.5b'
          - 'llama2:7b'
      port:
        description: '🔌 Web UI port'
        required: false
        default: '7860'
        type: string
      context_size:
        description: '📝 Context size (tokens)'
        required: false
        default: '4096'
        type: string

jobs:
  deploy-llama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🦙 Show Banner
        run: |
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║           🦙  L L A M A   1 B   W E B   U I                     ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "  📦 Model: ${{ github.event.inputs.model }}"
          echo "  📝 Context: ${{ github.event.inputs.context_size }} tokens"
          echo "  🔌 Port: ${{ github.event.inputs.port }}"
          echo "  🏃 Runner: $(uname -a)"
          echo "  💾 Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "  🧠 CPU: $(nproc) cores"
          echo ""

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing required packages"
          echo "──────────────────────────────────────────"
          
          # Install Ollama
          echo "🔧 Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Install Python packages
          echo "🐍 Installing Python packages..."
          pip install --no-cache-dir \
            fastapi \
            uvicorn \
            aiohttp \
            httpx \
            python-multipart \
            jinja2 \
            websockets \
            pydantic

          # Verify installations
          ollama --version || echo "⚠️ Ollama version check"
          python --version
          echo "✅ Dependencies installed!"

      - name: 📥 Download Model from Ollama
        run: |
          echo "──────────────────────────────────────────"
          echo " 📥  Downloading model: ${{ github.event.inputs.model }}"
          echo "──────────────────────────────────────────"
          
          MODEL="${{ github.event.inputs.model }}"
          
          echo "⏳ This may take 3-10 minutes depending on model size..."
          echo ""
          
          # Download the model
          ollama pull "$MODEL"
          
          echo ""
          echo "✅ Model downloaded successfully!"
          echo ""
          echo "📊 Installed models:"
          ollama list

      - name: 🔧 Create Ollama Server Script
        run: |
          cat > ollama_server.py << 'EOF'
          #!/usr/bin/env python3
          """
          🦙 Ollama Web Server - Single File Interface
          """
          
          import json
          import asyncio
          import subprocess
          import shutil
          from pathlib import Path
          from typing import Optional, Dict, List, Any
          from fastapi import FastAPI, HTTPException, Request
          from fastapi.responses import HTMLResponse, JSONResponse, StreamingResponse
          from fastapi.staticfiles import StaticFiles
          from pydantic import BaseModel
          import uvicorn
          import httpx
          import logging
          import sys
          import os
          from datetime import datetime
          
          # Setup logging
          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger(__name__)
          
          # Configuration
          OLLAMA_HOST = os.getenv("OLLAMA_HOST", "http://localhost:11434")
          CONTEXT_SIZE = int(os.getenv("CONTEXT_SIZE", "4096"))
          MODEL_NAME = os.getenv("MODEL_NAME", "llama3.2:1b")
          PORT = int(os.getenv("PORT", "7860"))
          
          app = FastAPI(title="🦙 Llama Web UI", description="Local LLM Interface")
          
          # Request/Response Models
          class ChatMessage(BaseModel):
              role: str
              content: str
          
          class ChatRequest(BaseModel):
              messages: List[ChatMessage]
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048
              stream: Optional[bool] = False
          
          class GenerateRequest(BaseModel):
              prompt: str
              temperature: Optional[float] = 0.7
              max_tokens: Optional[int] = 2048
              stream: Optional[bool] = False
          
          class ModelInfo(BaseModel):
              name: str
              size: str
              modified: str
          
          # ================================================================
          #  HTML UI Template
          # ================================================================
          HTML_TEMPLATE = '''
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🦙 Llama Web UI</title>
              <style>
                  * {
                      margin: 0;
                      padding: 0;
                      box-sizing: border-box;
                  }
                  body {
                      background: #0d1117;
                      color: #c9d1d9;
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                      height: 100vh;
                      display: flex;
                      flex-direction: column;
                  }
                  .header {
                      background: #161b22;
                      border-bottom: 1px solid #30363d;
                      padding: 16px 24px;
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      flex-shrink: 0;
                  }
                  .header h1 {
                      font-size: 20px;
                      font-weight: 600;
                      display: flex;
                      align-items: center;
                      gap: 10px;
                  }
                  .header .badge {
                      background: #238636;
                      color: #fff;
                      padding: 2px 10px;
                      border-radius: 12px;
                      font-size: 12px;
                  }
                  .header .model-name {
                      color: #8b949e;
                      font-size: 14px;
                  }
                  .status-bar {
                      padding: 8px 24px;
                      background: #0d1117;
                      border-bottom: 1px solid #21262d;
                      font-size: 13px;
                      color: #8b949e;
                      flex-shrink: 0;
                      display: flex;
                      justify-content: space-between;
                  }
                  .status-bar .status-dot {
                      display: inline-block;
                      width: 10px;
                      height: 10px;
                      border-radius: 50%;
                      margin-right: 8px;
                  }
                  .status-bar .status-dot.online { background: #3fb950; }
                  .status-bar .status-dot.offline { background: #da3633; }
                  
                  .chat-container {
                      flex: 1;
                      overflow-y: auto;
                      padding: 24px;
                      display: flex;
                      flex-direction: column;
                      gap: 16px;
                  }
                  .message {
                      max-width: 85%;
                      padding: 12px 16px;
                      border-radius: 12px;
                      line-height: 1.6;
                      word-wrap: break-word;
                      white-space: pre-wrap;
                  }
                  .message.user {
                      align-self: flex-end;
                      background: #238636;
                      color: #fff;
                  }
                  .message.assistant {
                      align-self: flex-start;
                      background: #21262d;
                      border: 1px solid #30363d;
                  }
                  .message .role-label {
                      font-size: 11px;
                      font-weight: 600;
                      opacity: 0.7;
                      margin-bottom: 4px;
                  }
                  .message .content {
                      font-size: 15px;
                  }
                  .message .content .loading-dots::after {
                      content: '...';
                      animation: dots 1.5s steps(4, end) infinite;
                  }
                  @keyframes dots {
                      0% { content: ''; }
                      25% { content: '.'; }
                      50% { content: '..'; }
                      75% { content: '...'; }
                  }
                  
                  .input-area {
                      background: #161b22;
                      border-top: 1px solid #30363d;
                      padding: 16px 24px;
                      flex-shrink: 0;
                      display: flex;
                      gap: 12px;
                  }
                  .input-area textarea {
                      flex: 1;
                      background: #0d1117;
                      border: 1px solid #30363d;
                      border-radius: 8px;
                      color: #c9d1d9;
                      padding: 12px;
                      font-family: inherit;
                      font-size: 14px;
                      resize: none;
                      outline: none;
                      min-height: 52px;
                      max-height: 150px;
                      transition: border-color 0.2s;
                  }
                  .input-area textarea:focus {
                      border-color: #58a6ff;
                  }
                  .input-area textarea::placeholder {
                      color: #484f58;
                  }
                  .input-area button {
                      background: #238636;
                      border: none;
                      border-radius: 8px;
                      color: #fff;
                      padding: 0 24px;
                      font-weight: 600;
                      font-size: 14px;
                      cursor: pointer;
                      transition: background 0.2s;
                      white-space: nowrap;
                      min-height: 52px;
                  }
                  .input-area button:hover {
                      background: #2ea043;
                  }
                  .input-area button:disabled {
                      opacity: 0.5;
                      cursor: not-allowed;
                  }
                  
                  .settings-row {
                      padding: 8px 24px;
                      background: #0d1117;
                      border-bottom: 1px solid #21262d;
                      display: flex;
                      gap: 16px;
                      flex-wrap: wrap;
                      align-items: center;
                      flex-shrink: 0;
                      font-size: 13px;
                  }
                  .settings-row label {
                      display: flex;
                      align-items: center;
                      gap: 6px;
                      color: #8b949e;
                  }
                  .settings-row input[type="range"] {
                      width: 100px;
                      background: #21262d;
                      height: 4px;
                      -webkit-appearance: none;
                  }
                  .settings-row input[type="range"]::-webkit-slider-thumb {
                      -webkit-appearance: none;
                      width: 14px;
                      height: 14px;
                      border-radius: 50%;
                      background: #58a6ff;
                      cursor: pointer;
                  }
                  .settings-row .value {
                      color: #c9d1d9;
                      font-weight: 600;
                      min-width: 30px;
                  }
                  
                  .footer {
                      padding: 8px 24px;
                      text-align: center;
                      font-size: 12px;
                      color: #484f58;
                      border-top: 1px solid #21262d;
                      flex-shrink: 0;
                  }
                  
                  /* Scrollbar */
                  .chat-container::-webkit-scrollbar {
                      width: 8px;
                  }
                  .chat-container::-webkit-scrollbar-track {
                      background: #0d1117;
                  }
                  .chat-container::-webkit-scrollbar-thumb {
                      background: #30363d;
                      border-radius: 4px;
                  }
                  .chat-container::-webkit-scrollbar-thumb:hover {
                      background: #484f58;
                  }
                  
                  @media (max-width: 640px) {
                      .header { flex-wrap: wrap; gap: 8px; }
                      .input-area { flex-wrap: wrap; }
                      .input-area textarea { min-height: 44px; }
                      .input-area button { min-height: 44px; padding: 0 16px; }
                      .message { max-width: 95%; }
                  }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>
                      🦙 Llama Web UI
                      <span class="badge">Local</span>
                  </h1>
                  <span class="model-name">📦 {{ model_name }}</span>
              </div>
              
              <div class="status-bar">
                  <span>
                      <span class="status-dot online" id="statusDot"></span>
                      <span id="statusText">Ollama Online</span>
                  </span>
                  <span id="tokenCount">Tokens: 0</span>
              </div>
              
              <div class="settings-row">
                  <label>
                      🌡️ Temperature
                      <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
                      <span class="value" id="tempValue">0.7</span>
                  </label>
                  <label>
                      📝 Max Tokens
                      <input type="range" id="maxTokens" min="128" max="4096" step="128" value="2048">
                      <span class="value" id="maxTokensValue">2048</span>
                  </label>
                  <label>
                      <input type="checkbox" id="streamCheck" checked>
                      Stream response
                  </label>
                  <button onclick="clearChat()" style="background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px;">
                      🗑️ Clear
                  </button>
              </div>
              
              <div class="chat-container" id="chatContainer">
                  <div class="message assistant">
                      <div class="role-label">🤖 Assistant</div>
                      <div class="content">Hello! I'm running <strong>{{ model_name }}</strong> locally.<br>Ask me anything! 😊</div>
                  </div>
              </div>
              
              <div class="input-area">
                  <textarea id="userInput" placeholder="Type your message here..." rows="1"></textarea>
                  <button id="sendButton" onclick="sendMessage()">🚀 Send</button>
              </div>
              
              <div class="footer">
                  🦙 Powered by Ollama • {{ model_name }} • {{ context_size }} context
              </div>
          
              <script>
                  // ================================================================
                  //  Chat Logic
                  // ================================================================
                  const chatContainer = document.getElementById('chatContainer');
                  const userInput = document.getElementById('userInput');
                  const sendButton = document.getElementById('sendButton');
                  const statusText = document.getElementById('statusText');
                  const statusDot = document.getElementById('statusDot');
                  const tokenCount = document.getElementById('tokenCount');
                  let isStreaming = false;
                  let totalTokens = 0;
                  
                  // Auto-resize textarea
                  userInput.addEventListener('input', function() {
                      this.style.height = 'auto';
                      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
                  });
                  
                  // Enter to send
                  userInput.addEventListener('keydown', function(e) {
                      if (e.key === 'Enter' && !e.shiftKey) {
                          e.preventDefault();
                          sendMessage();
                      }
                  });
                  
                  // Temperature slider
                  document.getElementById('temperature').addEventListener('input', function() {
                      document.getElementById('tempValue').textContent = this.value;
                  });
                  
                  document.getElementById('maxTokens').addEventListener('input', function() {
                      document.getElementById('maxTokensValue').textContent = this.value;
                  });
                  
                  function addMessage(role, content, isStreaming = false) {
                      const div = document.createElement('div');
                      div.className = `message ${role}`;
                      
                      const label = document.createElement('div');
                      label.className = 'role-label';
                      label.textContent = role === 'user' ? '👤 You' : '🤖 Assistant';
                      
                      const contentDiv = document.createElement('div');
                      contentDiv.className = 'content';
                      if (isStreaming) {
                          contentDiv.innerHTML = content + '<span class="loading-dots"></span>';
                      } else {
                          contentDiv.textContent = content;
                      }
                      
                      div.appendChild(label);
                      div.appendChild(contentDiv);
                      chatContainer.appendChild(div);
                      chatContainer.scrollTop = chatContainer.scrollHeight;
                      return contentDiv;
                  }
                  
                  function updateLastMessage(content, isComplete = false) {
                      const messages = chatContainer.querySelectorAll('.message.assistant');
                      if (messages.length === 0) return;
                      const lastMsg = messages[messages.length - 1];
                      const contentDiv = lastMsg.querySelector('.content');
                      if (contentDiv) {
                          if (isComplete) {
                              contentDiv.textContent = content;
                          } else {
                              contentDiv.innerHTML = content + '<span class="loading-dots"></span>';
                          }
                          chatContainer.scrollTop = chatContainer.scrollHeight;
                      }
                  }
                  
                  function clearChat() {
                      // Keep only the first assistant message
                      const messages = chatContainer.querySelectorAll('.message');
                      for (let i = 1; i < messages.length; i++) {
                          messages[i].remove();
                      }
                      totalTokens = 0;
                      tokenCount.textContent = 'Tokens: 0';
                  }
                  
                  async function sendMessage() {
                      if (isStreaming) return;
                      
                      const text = userInput.value.trim();
                      if (!text) return;
                      
                      // Add user message
                      addMessage('user', text);
                      userInput.value = '';
                      userInput.style.height = 'auto';
                      sendButton.disabled = true;
                      isStreaming = true;
                      
                      // Add placeholder for assistant
                      const tempDiv = addMessage('assistant', 'Thinking...', true);
                      
                      try {
                          const temperature = parseFloat(document.getElementById('temperature').value);
                          const maxTokens = parseInt(document.getElementById('maxTokens').value);
                          const stream = document.getElementById('streamCheck').checked;
                          
                          const response = await fetch('/api/chat', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({
                                  messages: [{ role: 'user', content: text }],
                                  temperature: temperature,
                                  max_tokens: maxTokens,
                                  stream: stream
                              })
                          });
                          
                          if (!response.ok) {
                              const error = await response.text();
                              throw new Error(error || 'Server error');
                          }
                          
                          if (stream) {
                              // Streaming response
                              const reader = response.body.getReader();
                              const decoder = new TextDecoder();
                              let fullContent = '';
                              let buffer = '';
                              
                              while (true) {
                                  const { done, value } = await reader.read();
                                  if (done) break;
                                  
                                  buffer += decoder.decode(value, { stream: true });
                                  const lines = buffer.split('\\n');
                                  buffer = lines.pop() || '';
                                  
                                  for (const line of lines) {
                                      if (line.startsWith('data: ')) {
                                          const data = line.slice(6);
                                          if (data === '[DONE]') continue;
                                          try {
                                              const parsed = JSON.parse(data);
                                              if (parsed.content) {
                                                  fullContent += parsed.content;
                                                  updateLastMessage(fullContent, false);
                                                  totalTokens += parsed.tokens || 1;
                                                  tokenCount.textContent = `Tokens: ${totalTokens}`;
                                              }
                                          } catch (e) {}
                                      }
                                  }
                              }
                              // Final update
                              updateLastMessage(fullContent, true);
                              totalTokens += Math.ceil(fullContent.length / 4);
                              tokenCount.textContent = `Tokens: ${totalTokens}`;
                          } else {
                              // Non-streaming
                              const data = await response.json();
                              updateLastMessage(data.content, true);
                              totalTokens += data.tokens || Math.ceil(data.content.length / 4);
                              tokenCount.textContent = `Tokens: ${totalTokens}`;
                          }
                          
                      } catch (error) {
                          console.error('Error:', error);
                          updateLastMessage('❌ Error: ' + error.message, true);
                      }
                      
                      sendButton.disabled = false;
                      isStreaming = false;
                      userInput.focus();
                  }
                  
                  // Check status periodically
                  async function checkStatus() {
                      try {
                          const response = await fetch('/api/status');
                          const data = await response.json();
                          if (data.status === 'online') {
                              statusDot.className = 'status-dot online';
                              statusText.textContent = 'Ollama Online';
                          } else {
                              statusDot.className = 'status-dot offline';
                              statusText.textContent = 'Ollama Offline';
                          }
                      } catch (e) {
                          statusDot.className = 'status-dot offline';
                          statusText.textContent = 'Server Offline';
                      }
                  }
                  setInterval(checkStatus, 30000);
                  checkStatus();
              </script>
          </body>
          </html>
          '''
          
          # ================================================================
          #  FastAPI Endpoints
          # ================================================================
          
          @app.get("/", response_class=HTMLResponse)
          async def root():
              """Serve the web UI"""
              return HTML_TEMPLATE.replace(
                  "{{ model_name }}", MODEL_NAME
              ).replace(
                  "{{ context_size }}", str(CONTEXT_SIZE)
              )
          
          @app.get("/api/status")
          async def status():
              """Check if Ollama is running"""
              try:
                  async with httpx.AsyncClient(timeout=3) as client:
                      resp = await client.get(f"{OLLAMA_HOST}/api/tags")
                      if resp.status_code == 200:
                          return {"status": "online", "models": resp.json()}
              except:
                  pass
              return {"status": "offline"}
          
          @app.get("/api/models")
          async def list_models():
              """List downloaded models"""
              try:
                  async with httpx.AsyncClient(timeout=5) as client:
                      resp = await client.get(f"{OLLAMA_HOST}/api/tags")
                      if resp.status_code == 200:
                          return resp.json()
              except:
                  pass
              return {"models": []}
          
          @app.post("/api/chat")
          async def chat(request: ChatRequest):
              """Chat with Ollama"""
              try:
                  # Convert messages to Ollama format
                  ollama_messages = [{"role": m.role, "content": m.content} for m in request.messages]
                  
                  if request.stream:
                      # Streaming response
                      async def generate():
                          try:
                              async with httpx.AsyncClient(timeout=120) as client:
                                  async with client.stream(
                                      "POST",
                                      f"{OLLAMA_HOST}/api/chat",
                                      json={
                                          "model": MODEL_NAME,
                                          "messages": ollama_messages,
                                          "stream": True,
                                          "options": {
                                              "temperature": request.temperature,
                                              "num_predict": request.max_tokens,
                                              "num_ctx": CONTEXT_SIZE
                                          }
                                      }
                                  ) as response:
                                      async for chunk in response.aiter_bytes():
                                          try:
                                              data = chunk.decode('utf-8').strip()
                                              if data:
                                                  lines = data.split('\\n')
                                                  for line in lines:
                                                      if line.strip():
                                                          try:
                                                              json_data = json.loads(line)
                                                              if "message" in json_data and "content" in json_data["message"]:
                                                                  content = json_data["message"]["content"]
                                                                  yield f"data: {json.dumps({'content': content})}\\n\\n"
                                                          except json.JSONDecodeError:
                                                              continue
                                          except:
                                              continue
                          except Exception as e:
                              yield f"data: {json.dumps({'error': str(e)})}\\n\\n"
                          yield "data: [DONE]\\n\\n"
                      
                      return StreamingResponse(generate(), media_type="text/event-stream")
                  else:
                      # Non-streaming response
                      async with httpx.AsyncClient(timeout=120) as client:
                          resp = await client.post(
                              f"{OLLAMA_HOST}/api/chat",
                              json={
                                  "model": MODEL_NAME,
                                  "messages": ollama_messages,
                                  "stream": False,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE
                                  }
                              }
                          )
                          data = resp.json()
                          return {
                              "content": data.get("message", {}).get("content", ""),
                              "tokens": data.get("eval_count", 0)
                          }
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))
          
          @app.post("/api/generate")
          async def generate(request: GenerateRequest):
              """Generate text"""
              try:
                  if request.stream:
                      async def generate():
                          try:
                              async with httpx.AsyncClient(timeout=120) as client:
                                  async with client.stream(
                                      "POST",
                                      f"{OLLAMA_HOST}/api/generate",
                                      json={
                                          "model": MODEL_NAME,
                                          "prompt": request.prompt,
                                          "stream": True,
                                          "options": {
                                              "temperature": request.temperature,
                                              "num_predict": request.max_tokens,
                                              "num_ctx": CONTEXT_SIZE
                                          }
                                      }
                                  ) as response:
                                      async for chunk in response.aiter_bytes():
                                          try:
                                              data = chunk.decode('utf-8').strip()
                                              if data:
                                                  lines = data.split('\\n')
                                                  for line in lines:
                                                      if line.strip():
                                                          try:
                                                              json_data = json.loads(line)
                                                              if "response" in json_data:
                                                                  yield f"data: {json.dumps({'content': json_data['response']})}\\n\\n"
                                                          except:
                                                              continue
                                          except:
                                              continue
                          except Exception as e:
                              yield f"data: {json.dumps({'error': str(e)})}\\n\\n"
                          yield "data: [DONE]\\n\\n"
                      return StreamingResponse(generate(), media_type="text/event-stream")
                  else:
                      async with httpx.AsyncClient(timeout=120) as client:
                          resp = await client.post(
                              f"{OLLAMA_HOST}/api/generate",
                              json={
                                  "model": MODEL_NAME,
                                  "prompt": request.prompt,
                                  "stream": False,
                                  "options": {
                                      "temperature": request.temperature,
                                      "num_predict": request.max_tokens,
                                      "num_ctx": CONTEXT_SIZE
                                  }
                              }
                          )
                          data = resp.json()
                          return {
                              "content": data.get("response", ""),
                              "tokens": data.get("eval_count", 0)
                              }
              except Exception as e:
                  raise HTTPException(status_code=500, detail=str(e))
          
          # ================================================================
          #  Main Entry Point
          # ================================================================
          
          if __name__ == "__main__":
              print("🦙 Starting Llama Web UI...")
              print(f"   Model: {MODEL_NAME}")
              print(f"   Context: {CONTEXT_SIZE}")
              print(f"   Port: {PORT}")
              print(f"   Ollama: {OLLAMA_HOST}")
              print("")
              print("🌐 Open http://localhost:" + str(PORT) + " in your browser")
              print("")
              
              uvicorn.run(
                  app,
                  host="0.0.0.0",
                  port=PORT,
                  log_level="info"
              )
          EOF
          
          echo "✅ Server script created!"

      - name: 🚀 Start Ollama Server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🚀  Starting Ollama server"
          echo "──────────────────────────────────────────"
          
          # Start Ollama in background
          ollama serve &
          
          # Wait for Ollama to be ready
          echo "⏳ Waiting for Ollama to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready!"
              break
            fi
            sleep 2
          done
          
          echo "📊 Ollama status:"
          curl -s http://localhost:11434/api/tags | python -m json.tool || echo "⚠️ Status check"

      - name: 🔧 Start Web Server
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Starting Web UI server"
          echo "──────────────────────────────────────────"
          
          # Set environment variables for the server
          export MODEL_NAME="${{ github.event.inputs.model }}"
          export CONTEXT_SIZE="${{ github.event.inputs.context_size }}"
          export PORT="${{ github.event.inputs.port }}"
          
          # Start the server in background
          python ollama_server.py &
          
          # Wait for server to be ready
          echo "⏳ Waiting for web server to start..."
          for i in {1..15}; do
            if curl -s http://localhost:${{ github.event.inputs.port }} > /dev/null 2>&1; then
              echo "✅ Web UI is ready!"
              break
            fi
            sleep 2
          done

      - name: 📦 Install Cloudflared
        run: |
          echo "──────────────────────────────────────────"
          echo " 📦  Installing Cloudflared"
          echo "──────────────────────────────────────────"
          
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: 🌐 Create Tunnel
        id: tunnel
        run: |
          echo "──────────────────────────────────────────"
          echo " 🌐  Creating Cloudflare tunnel"
          echo "──────────────────────────────────────────"
          
          PORT="${{ github.event.inputs.port }}"
          
          cloudflared tunnel --url http://127.0.0.1:$PORT --protocol http2 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          COUNTER=0
          
          while [ -z "$TUNNEL_URL" ] && [ $COUNTER -lt 60 ]; do
            if [ -f tunnel.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            fi
            sleep 2
            COUNTER=$((COUNTER + 2))
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║           🎉  L L A M A   I S   R E A D Y !  🎉                 ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║                                                                   ║"
          if [ -n "$TUNNEL_URL" ]; then
            echo "║  🔗  TUNNEL URL:  $TUNNEL_URL"
          else
            echo "║  ⚠️  Check logs above for the tunnel URL"
          fi
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🦙  Model: ${{ github.event.inputs.model }}                     ║"
          echo "║  📝  Context: ${{ github.event.inputs.context_size }} tokens    ║"
          echo "║  🌐  Status: Online & Ready                                      ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  📌  HOW TO USE:                                                  ║"
          echo "║  1. Open the URL above in your browser                           ║"
          echo "║  2. Type your message in the chat box                            ║"
          echo "║  3. Click Send or press Enter                                    ║"
          echo "║  4. Adjust Temperature and Max Tokens in settings                ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  ⏱️  Tunnel expires in ~6 hours (GitHub Action limit)            ║"
          echo "║  🧠  Memory usage: ~1-2GB RAM for 1B model                      ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          
          wait $TUNNEL_PID

      - name: Display Final URL
        if: always() && env.TUNNEL_URL != ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  🔗  ACCESS YOUR LLAMA WEB UI:"
          echo "  📌  ${{ env.TUNNEL_URL }}"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🦙  Model: ${{ github.event.inputs.model }}"
          echo "  📝  Context: ${{ github.event.inputs.context_size }} tokens"
          echo "  ⏱️  Available for: ~6 hours"
          echo ""

      - name: Show error if tunnel failed
        if: failure() || env.TUNNEL_URL == ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  ⚠️  TUNNEL CREATION FAILED - CHECK LOGS"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🔍 Look for 'trycloudflare.com' in the logs above"
          echo "  📝 The URL format is: https://[random-words].trycloudflare.com"

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          docker stop $(docker ps -aq) 2>/dev/null || true
          pkill -f "cloudflared" 2>/dev/null || true
          pkill -f "python ollama_server" 2>/dev/null || true
          echo "✅ Cleanup complete"
