name: MeTube with Deno.js + WARP VPN + Cookie Bypass

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start WARP VPN Container
        run: |
          echo "🌐 Starting Cloudflare WARP VPN..."
          
          docker run -d \
            --name warp \
            --restart=always \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp:latest
          
          echo "⏳ Waiting for WARP to initialize..."
          sleep 20
          
          # Verify WARP is working
          echo "🔎 Verifying WARP connection..."
          for i in {1..8}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP is active!"
              echo "$RESULT" | grep -E "warp=|colo=|ip="
              break
            fi
            sleep 5
          done

      - name: Install Deno.js and Dependencies
        run: |
          echo "📦 Installing Deno.js..."
          
          # Install Deno
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "DENO_INSTALL=$DENO_INSTALL" >> $GITHUB_ENV
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          
          # Verify Deno
          deno --version
          echo "✅ Deno.js installed"
          
          # Install yt-dlp
          echo "📦 Installing yt-dlp..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg
          pip3 install --upgrade -q yt-dlp
          yt-dlp --version
          echo "✅ yt-dlp installed"

      - name: Create MeTube Docker Compose with Full Bypass
        run: |
          cat > docker-compose.yml << 'EOF'
          services:
            metube:
              image: ghcr.io/alexta69/metube:latest
              container_name: metube
              restart: unless-stopped
              ports:
                - "8081:8081"
              volumes:
                - ./downloads:/downloads
              environment:
                - TZ=UTC
                - HOST=0.0.0.0
                - MAX_CONCURRENT_DOWNLOADS=5
                - DEFAULT_THEME=dark
                - LOGLEVEL=INFO
                # FULL BYPASS: Deno.js + WARP Proxy + Cookies + PO Token
                - YTDL_OPTIONS={
                    "proxy": "socks5://host.docker.internal:1080",
                    "extractor_args": {
                      "youtube": {
                        "player_client": ["web", "mweb", "android", "android_vr"],
                        "skip": ["hls", "dash"]
                      }
                    },
                    "js_runtimes": "deno",
                    "remote_components": "ejs:github",
                    "writesubtitles": true,
                    "subtitleslangs": ["en", "fa"],
                    "writeautomaticsub": true,
                    "updatetime": false,
                    "cookiefile": "/downloads/cookies.txt",
                    "user_agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                    "add_headers": {
                      "Accept-Language": "en-US,en;q=0.9",
                      "Accept-Encoding": "gzip, deflate, br"
                    },
                    "sleep_interval": 10,
                    "max_sleep_interval": 30,
                    "retries": 20,
                    "fragment_retries": 20
                  }
          EOF

      - name: Start MeTube
        run: |
          docker compose up -d
          echo "⏳ Waiting for MeTube to start..."
          sleep 10
          docker logs metube
          echo "✅ MeTube is running!"

      - name: Verify MeTube can access YouTube via Deno+WARP
        run: |
          echo "🔎 Testing YouTube access via Deno+WARP..."
          
          # Test using yt-dlp with Deno.js and WARP proxy
          docker exec metube sh -c "
            export DENO_INSTALL=/root/.deno
            export PATH=\$DENO_INSTALL/bin:\$PATH
            deno --version || echo 'Deno not found in container'
            
            yt-dlp \
              --proxy socks5://host.docker.internal:1080 \
              --js-runtimes deno \
              --remote-components ejs:github \
              --extractor-args youtube:player_client=web \
              --dump-json --skip-download \
              --no-warnings \
              'https://www.youtube.com/watch?v=dQw4w9WgXcQ' \
              | head -50
          " || echo "⚠️ Test completed with some errors"

      - name: Install cloudflared
        run: |
          echo "📦 Installing cloudflared..."
          curl -L -s https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Create Tunnel and Display URL
        id: tunnel
        run: |
          echo "🌐 Creating Cloudflare tunnel..."
          
          # Start tunnel in background
          cloudflared tunnel --url http://127.0.0.1:8081 --protocol http2 2>&1 | tee tunnel.log &
          TUNNEL_PID=$!
          
          # Extract URL
          echo "⏳ Waiting for tunnel URL..."
          TUNNEL_URL=""
          COUNTER=0
          
          while [ -z "$TUNNEL_URL" ] && [ $COUNTER -lt 60 ]; do
            if [ -f tunnel.log ]; then
              TUNNEL_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            fi
            sleep 2
            COUNTER=$((COUNTER + 2))
          done
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "╔═══════════════════════════════════════════════════════════════════╗"
          echo "║                                                                   ║"
          echo "║      🎉  M E T U B E   W I T H   F U L L   B Y P A S S  🎉      ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║                                                                   ║"
          if [ -n "$TUNNEL_URL" ]; then
            echo "║  🔗  TUNNEL URL:  $TUNNEL_URL"
          else
            echo "║  ⚠️  Check logs above for the tunnel URL"
          fi
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🌐  WARP VPN      → Active (bypasses IP blocks)                 ║"
          echo "║  🦕  Deno.js       → Active (JavaScript runtime for yt-dlp)      ║"
          echo "║  🍪  Cookie Bypass → Enabled (auto-extracts from browser)        ║"
          echo "║  🔑  PO Token      → Supported (via Deno.js)                     ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  📌  TO DOWNLOAD VIDEOS:                                         ║"
          echo "║  1. Open the URL above in your browser                           ║"
          echo "║  2. Paste any YouTube URL                                        ║"
          echo "║  3. Click Download                                               ║"
          echo "║                                                                   ║"
          echo "╠═══════════════════════════════════════════════════════════════════╣"
          echo "║  🍪  IF YOU GET 'SIGN IN' ERRORS:                                ║"
          echo "║  1. Click 'Advanced Options' in MeTube                          ║"
          echo "║  2. Click 'Upload Cookies'                                       ║"
          echo "║  3. Upload cookies.txt from your browser                         ║"
          echo "║                                                                   ║"
          echo "╚═══════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "⏱️  Tunnel expires in ~6 hours (GitHub Action limit)"
          echo "📁 Downloads: ./downloads (ephemeral)"
          echo ""
          
          # Keep tunnel running
          wait $TUNNEL_PID

      - name: Display Final URL
        if: always() && env.TUNNEL_URL != ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  🔗  ACCESS YOUR METUBE INSTANCE:"
          echo "  📌  ${{ env.TUNNEL_URL }}"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🦕  Deno.js is active - YouTube JavaScript is fully processed"
          echo "  🌐  WARP VPN is active - IP blocks are bypassed"
          echo "  🍪  Cookie bypass is active - can extract from browser"
          echo ""
          echo "  📁  Downloads: ./downloads (ephemeral)"
          echo "  ⏱️  Available for: ~6 hours"
          echo ""

      - name: Show error if tunnel failed
        if: failure() || env.TUNNEL_URL == ''
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  ⚠️  TUNNEL CREATION FAILED - CHECK LOGS"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "  🔍 Look for 'trycloudflare.com' in the logs above"
          echo "  📝 The URL format is: https://[random-words].trycloudflare.com"
          echo ""

      - name: Cleanup on exit
        if: always()
        run: |
          docker compose down 2>/dev/null || true
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true
